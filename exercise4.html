<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين المملكة 4 - فرقعة بالونات العمر 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-party: linear-gradient(135deg, #fdf2f8, #fae8ff);
            --neon-pink: #db2777;
        }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg-party);
            color: #1e1b4b; margin: 0; padding: 15px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .title-zone { text-align: center; margin-bottom: 20px; }
        .title-zone h1 { font-size: 1.4rem; color: var(--neon-pink); font-weight: 900; margin: 0; }
        
        .cake-display {
            font-size: 3.5rem; background: white; padding: 15px; border-radius: 25px;
            box-shadow: 0 8px 20px rgba(219,39,119,0.08); border: 2px solid #fbcfe8;
            margin-bottom: 20px; width: 100%; max-width: 360px; text-align: center; box-sizing: border-box;
        }

        /* محاكي بالونات كرتوني متدلي */
        .balloon-grid { display: flex; justify-content: center; gap: 15px; margin-top: 10px; width: 100%; max-width: 400px; }
        .balloon-btn {
            background: linear-gradient(135deg, #ec4899, #f43f5e); color: white;
            border: none; width: 75px; height: 95px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            font-size: 1.6rem; font-weight: 900; font-family: 'Cairo'; cursor: pointer;
            box-shadow: 0 8px 15px rgba(244,63,94,0.3); transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .balloon-btn:after { content: "🎈"; position: absolute; bottom: -12px; font-size: 0.8rem; color: #f43f5e; }
        .balloon-btn:active { transform: scale(0.85); }
        .balloon-btn.popped { background: #cbd5e1; box-shadow: none; transform: scale(0.5); opacity: 0; pointer-events: none; }

        .party-celebration { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: white; z-index:100; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div class="title-zone">
    <h1>تحدي شموع تورتة الحفلة! 🎂🎉</h1>
    <p>عد الشموع المضيئة وافرقع البالونة التي تحمل الرقم الصحيح فوراً!</p>
</div>

<div class="cake-display">
    <!-- الشموع المعروضة -->
    <div style="font-size: 2.2rem; letter-spacing: 3px; margin-bottom: 8px;">🕯️🕯️🕯️🕯️</div>
    <div style="font-size: 0.95rem; font-weight: bold; color: #6b21a8;">كم شمعة تضيء التورتة السحرية؟</div>
</div>

<div class="balloon-grid">
    <button class="balloon-btn" onclick="popBalloon(2, this)">2</button>
    <button class="balloon-btn" style="background: linear-gradient(135deg, #06b6d4, #0ea5e9);" onclick="popBalloon(4, this)">4</button>
    <button class="balloon-btn" style="background: linear-gradient(135deg, #eab308, #ca8a04);" onclick="popBalloon(5, this)">5</button>
</div>

<button onclick="window.location.href='dashboard.html'" style="margin-top:35px; background:#4b5563; color:white; border:none; padding:10px 25px; font-family:'Cairo'; font-weight:bold; border-radius:50px; cursor:pointer;">العودة للحصن 🏰</button>

<div id="party-screen" class="party-celebration">
    <h1 style="font-size: 5rem; margin:0;">🎈🍿🥳</h1>
    <h2 style="color: var(--neon-pink); font-weight: 900;">فرقعة بالونات مذهلة!</h2>
    <p style="font-weight: bold; color: #4b5563;">أنت تتقن تمييز الأعداد البصرية والكميات كلمح البصر!</p>
    <button onclick="window.location.href='dashboard.html'" style="background:var(--neon-pink); color:white; border:none; padding:12px 35px; font-family:'Cairo'; font-weight:bold; border-radius:50px; cursor:pointer;">احصد النجوم وتابع 🥇</button>
</div>

<script>
    function popBalloon(number, element) {
        if(number === 4) {
            element.classList.add('popped');
            setTimeout(() => {
                document.getElementById('party-screen').style.display = 'flex';
            }, 500);
        } else {
            // اهتزاز البالونة الخاطئة لإنذار الطفل بصرياً بلطف
            element.style.transform = 'translateX(8px)';
            setTimeout(() => element.style.transform = 'none', 150);
        }
    }
</script>
</body>
</html>
