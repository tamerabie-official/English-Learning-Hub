<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوحدة 3: عائلتي - English Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fce4ec; margin: 0; padding: 20px; text-align: center; }
        .unit-header { background: #ad1457; color: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(173, 20, 87, 0.3); }
        .section-title { color: #880e4f; margin-top: 30px; border-bottom: 2px solid #f06292; display: inline-block; padding-bottom: 5px; }
        
        /* شبكة أفراد العائلة [7، 14] */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .card { background: white; padding: 15px; border-radius: 20px; border: 2px solid #f06292; cursor: pointer; transition: 0.3s; }
        .card:active { transform: scale(0.9); background: #f8bbd0; }
        .card span { display: block; font-size: 2.5rem; }
        .label { font-weight: bold; color: #ad1457; margin-top: 10px; }

        /* قسم الأرقام 1-5 [9، 21] */
        .number-row { display: flex; justify-content: space-around; margin-top: 15px; background: white; padding: 15px; border-radius: 20px; }
        .num-circle { width: 45px; height: 45px; background: #ad1457; color: white; border-radius: 50%; line-height: 45px; font-weight: bold; cursor: pointer; }

        /* معمل الصوتيات (Nn, Pp, Hh, Dd) [8، 23] */
        .phonics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .letter-btn { background: #f06292; color: white; padding: 10px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="unit-header">
        <h1>👨‍👩‍👧‍👦 Unit 3: I Love My Family</h1>
        <p>مرحباً بك في منزل Maya و Sara [7، 21]</p>
    </div>

    <h3 class="section-title">أفراد العائلة (Family Members)</h3>
    <div class="grid">
        <div class="card" onclick="speak('This is my father')"><span>👨</span><div class="label">Father</div></div>
        <div class="card" onclick="speak('This is my mother')"><span>👩</span><div class="label">Mother</div></div>
        <div class="card" onclick="speak('They are my parents')"><span>👫</span><div class="label">Parents</div></div>
        <div class="card" onclick="speak('This is my brother')"><span>👦</span><div class="label">Brother</div></div>
        <div class="card" onclick="speak('This is my sister')"><span>👧</span><div class="label">Sister</div></div>
        <div class="card" onclick="speak('Grandmother')"><span>👵</span><div class="label">Grandmother</div></div>
    </div>

    <h3 class="section-title">تحدي الأرقام (Numbers 1-5)</h3>
    <div class="number-row">
        <div class="num-circle" onclick="speak('One star')">1</div>
        <div class="num-circle" onclick="speak('Two bags')">2</div>
        <div class="num-circle" onclick="speak('Three pencils')">3</div>
        <div class="num-circle" onclick="speak('Four books')">4</div>
        <div class="num-circle" onclick="speak('Five apples')">5</div>
    </div>

    <h3 class="section-title">معمل الصوتيات (Phonics Lab)</h3>
    <p>اضغط لتسمع أصوات الحروف وكلماتها [8، 23]</p>
    <div class="phonics-grid">
        <button class="letter-btn" onclick="speak('N, N, Nose, Neck')">Nn</button>
        <button class="letter-btn" onclick="speak('P, P, Pencil, Pen')">Pp</button>
        <button class="letter-btn" onclick="speak('H, H, Hat, Horse')">Hh</button>
        <button class="letter-btn" onclick="speak('D, D, Dog, Door')">Dd</button>
    </div>

    <br>
    <button onclick="window.location.href='dashboard.html'" style="padding:15px; border-radius:25px; border:none; background:#333; color:white; cursor:pointer;">العودة للوحة التحكم</button>

    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }
    </script>

</body>
</html>
