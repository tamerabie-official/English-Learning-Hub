<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين المملكة 5 - غواصة العائلة السحرية 🌊</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-ocean: linear-gradient(180deg, #0284c7 0%, #0c4a6e 100%);
            --neon-cyan: #22d3ee;
        }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg-ocean);
            color: white; margin: 0; padding: 15px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .ocean-title { text-align: center; margin-bottom: 15px; }
        .ocean-title h1 { font-size: 1.3rem; color: var(--neon-cyan); font-weight: 900; margin: 0; }
        
        .sub-card {
            width: 100%; max-width: 400px; background: rgba(255,255,255,0.07);
            border: 3px solid var(--neon-cyan); border-radius: 35px;
            padding: 20px; text-align: center; box-sizing: border-box;
            backdrop-filter: blur(10px); box-shadow: 0 15px 30px rgba(34,211,238,0.15);
        }
        .sub-visual { font-size: 4.5rem; display: block; animation: floatSub 3s ease-in-out infinite; }
        @keyframes floatSub { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .bubble-target {
            background: rgba(34,211,238,0.15); border: 2px dashed var(--neon-cyan);
            padding: 12px; border-radius: 20px; font-size: 1.5rem; font-weight: 900;
            color: #ccfbf1; margin: 15px 0; text-shadow: 0 2px 10px rgba(34,211,238,0.5);
        }
        
        .bubbles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .bubble-btn {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px; padding: 14px; font-family: 'Cairo'; font-weight: bold;
            color: white; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .bubble-btn:active { transform: scale(0.9); }
        .bubble-btn.popped-success { background: #16a34a; border-color: #4ade80; font-weight: 900; }
        .bubble-btn.popped-fail { background: #dc2626; border-color: #f87171; }

        .sea-win { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #0c4a6e; z-index:100; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div class="ocean-title">
    <h1>مستكشف الأعماق: كنز العائلة! 🌊💎</h1>
    <p>انقر على فقاعة أفراد العائلة المطابقة للكلمة المضيئة</p>
</div>

<div class="sub-card">
    <span class="sub-visual">🤿 submarine</span>
    <div class="bubble-target" id="word-screen">Mother 👩‍🦰</div>
    
    <div class="bubbles-grid">
        <button class="bubble-btn" onclick="popBubble('Mother', this)">Mother 👩‍🦰</button>
        <button class="bubble-btn" onclick="popBubble('Father', this)">Father 👨</button>
        <button class="bubble-btn" onclick="popBubble('Brother', this)">Brother 👦</button>
        <button class="bubble-btn" onclick="popBubble('Sister', this)">Sister 👧</button>
    </div>
</div>

<button onclick="window.location.href='dashboard.html'" style="margin-top:25px; background:rgba(255,255,255,0.2); color:white; border:none; padding:10px 25px; font-family:'Cairo'; font-weight:bold; border-radius:50px; cursor:pointer;">صعود للسطح 🚢</button>

<div id="sea-win-screen" class="sea-win">
    <h1 style="font-size: 5rem; margin:0;">🧜‍♂️👑🐳</h1>
    <h2 style="color: var(--neon-cyan); font-weight: 900;">غطاس لغوي ماهر!</h2>
    <p style="font-weight: bold; color: #e2e8f0;">لقد جمعت كل لآلئ العائلة السحرية من أعماق المحيط!</p>
    <button onclick="window.location.href='dashboard.html'" style="background:var(--neon-cyan); color:#0c4a6e; border:none; padding:12px 35px; font-family:'Cairo'; font-weight:bold; border-radius:50px; cursor:pointer;">عد للوحة التحكم وافتح الهدية 🏆</button>
</div>

<script>
    const seaTasks = [
        { display: "Mother 👩‍🦰", key: "Mother" },
        { display: "Father 👨", key: "Father" },
        { display: "Brother 👦", key: "Brother" },
        { display: "Sister 👧", key: "Sister" }
    ];
    let seaIndex = 0;

    function popBubble(selectedKey, btnElement) {
        const currentTask = seaTasks[seaIndex];
        if(selectedKey === currentTask.key) {
            btnElement.classList.add('popped-success');
            setTimeout(() => {
                btnElement.classList.remove('popped-success');
                seaIndex++;
                if(seaIndex < seaTasks.length) {
                    document.getElementById('word-screen').innerText = seaTasks[seaIndex].display;
                } else {
                    document.getElementById('sea-win-screen').style.display = 'flex';
                }
            }, 600);
        } else {
            btnElement.classList.add('popped-fail');
            setTimeout(() => btnElement.classList.remove('popped-fail'), 500);
        }
    }
</script>
</body>
</html>
