<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الكنز التعليمية - لوحة التحكم 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-bg: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --gold-accent: #f59e0b;
            --mom-accent: #ec4899;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--space-bg);
            color: #f8fafc;
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .dashboard-container { width: 100%; max-width: 600px; }

        .welcome-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; padding: 25px 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 25px;
        }
        
        .local-avatar-profile {
            width: 75px; height: 75px; border-radius: 50%; 
            margin: 0 auto 15px auto; background-size: cover; background-position: center; 
            border: 3px solid var(--gold-accent); display: none;
            background-color: rgba(255,255,255,0.05);
            align-items: center; justify-content: center;
        }
        
        .welcome-card h1 { margin: 0; font-size: 1.6rem; font-weight: 900; color: var(--gold-accent); }
        .welcome-card p { margin: 8px 0 0 0; color: #94a3b8; font-size: 0.95rem; }

        .mode-selector-zone {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px; padding: 6px; display: flex;
            margin-bottom: 30px; border: 2px dashed rgba(255, 255, 255, 0.15);
        }
        .mode-btn {
            flex: 1; border: none; background: transparent; color: #94a3b8;
            padding: 12px; font-family: 'Cairo'; font-weight: bold; cursor: pointer;
            border-radius: 50px; transition: all 0.3s ease;
        }
        .mode-btn.active-solo { background: linear-gradient(90deg, #d97706, #f59e0b); color: #0f172a; }
        .mode-btn.active-mom { background: linear-gradient(90deg, #db2777, #ec4899); color: white; }

        .grid-kingdoms { display: grid; grid-template-columns: 1fr; gap: 16px; }
        
        .kingdom-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px; padding: 16px;
            display: flex; align-items: center; justify-content: space-between;
            transition: transform 0.2s; cursor: pointer;
        }
        .kingdom-card:hover { transform: scale(1.02); border-color: var(--gold-accent); }
        
        .kingdom-info { display: flex; align-items: center; gap: 14px; }
        .kingdom-icon { font-size: 2rem; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.05); border-radius: 18px; }
        .kingdom-title { font-weight: 900; color: #f1f5f9; }
        .kingdom-subtitle { font-size: 0.8rem; color: #64748b; }
        
        .badge-score {
            background: #1e293b; padding: 6px 14px; border-radius: 50px; 
            font-size: 0.85rem; font-weight: bold; color: var(--gold-accent);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mom-pride-zone {
            margin-bottom: 20px; background: linear-gradient(135deg, #4d072b, #1e1b4b);
            border: 2px solid var(--mom-accent); border-radius: 25px; padding: 15px;
            text-align: center; display: none;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="welcome-card">
        <div id="local-avatar-profile-zone" class="local-avatar-profile"></div>
        <h1 id="welcome-user">مرحباً بك يا بطل 🚀</h1>
        <p id="welcome-sub">استعد لفك شفرات اللغة الإنجليزية!</p>
    </div>

    <div class="mode-selector-zone">
        <button class="mode-btn active-solo" id="btn-solo" onclick="switchPlayMode('solo')">🚀 طيار فردي</button>
        <button class="mode-btn" id="btn-mom" onclick="switchPlayMode('mom')">👩‍👦 تحدي كوني مع ماما</button>
    </div>

    <div class="mom-pride-zone" id="pride-panel">
        <h3 style="margin:0; color: var(--mom-accent);">🏆 لوحة شرف "بصي يا ماما!"</h3>
    </div>

    <div class="grid-kingdoms">
        <!-- المملكة 1 -->
        <div class="kingdom-card" onclick="launchUnit(1)">
            <div class="kingdom-info">
                <div class="kingdom-icon">👋</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 1: Hello!</div>
                    <div class="kingdom-subtitle">مرحباً بكم</div>
                </div>
            </div>
            <div class="badge-score" id="u1-score">جاري التحميل..</div>
        </div>
        <!-- المملكة 2 -->
        <div class="kingdom-card" onclick="launchUnit(2)">
            <div class="kingdom-info">
                <div class="kingdom-icon">🧑‍💻</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 2: This is me</div>
                </div>
            </div>
            <div class="badge-score" id="u2-score">...</div>
        </div>
        <!-- المملكة 3 -->
        <div class="kingdom-card" onclick="launchUnit(3)">
            <div class="kingdom-info">
                <div class="kingdom-icon">🎒</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 3: My school bag</div>
                </div>
            </div>
            <div class="badge-score" id="u3-score">...</div>
        </div>
        <!-- المملكة 4 -->
        <div class="kingdom-card" onclick="launchUnit(4)">
            <div class="kingdom-info">
                <div class="kingdom-icon">🎂</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 4: My birthday</div>
                </div>
            </div>
            <div class="badge-score" id="u4-score">...</div>
        </div>
        <!-- المملكة 5 -->
        <div class="kingdom-card" onclick="launchUnit(5)">
            <div class="kingdom-info">
                <div class="kingdom-icon">🏡</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 5: My family</div>
                </div>
            </div>
            <div class="badge-score" id="u5-score">...</div>
        </div>
        <!-- المملكة 6 -->
        <div class="kingdom-card" onclick="launchUnit(6)">
            <div class="kingdom-info">
                <div class="kingdom-icon">🎵</div>
                <div class="kingdom-text">
                    <div class="kingdom-title">المملكة 6: Music</div>
                </div>
            </div>
            <div class="badge-score" id="u6-score">...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ✅ تم تصحيح المفتاح هنا ليتطابق 100% مع الملف الرئيسي
    const dbClient = supabase.createClient('https://cjpdnptndkceescvubmg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM');
    
    let currentStudentName = localStorage.getItem('Full Name') || 'بطل السايبر';
    let currentUsername = localStorage.getItem('Username');

    window.onload = () => {
        document.getElementById('welcome-user').innerText = `مرحباً بك يا ${currentStudentName} 🚀`;
        
        const localImg = localStorage.getItem('studentAvatarImg');
        const avatarDiv = document.getElementById('local-avatar-profile-zone');
        if (localImg && avatarDiv) {
            if (localImg.startsWith('data:image') || localImg.includes('.jpg')) {
                avatarDiv.style.backgroundImage = `url('${localImg}')`;
                avatarDiv.style.display = 'block';
            } else if (localImg.trim() !== "") {
                avatarDiv.style.display = 'flex';
                avatarDiv.style.fontSize = '2rem';
                avatarDiv.innerText = localImg;
            }
        }
        
        fetchLiveMetrics();
    };

    async function fetchLiveMetrics() {
        if (!currentUsername) {
            window.location.href = 'index.html';
            return;
        }

        const { data, error } = await dbClient
            .from('students')
            .select('*')
            .eq('Username', currentUsername)
            .single();
        
        if (!data || error) {
            console.error("تعذر جلب بيانات الممالك:", error);
            localStorage.clear();
            window.location.href = 'index.html'; 
            return;
        }

        for (let i = 1; i <= 6; i++) {
            const score = data[`Unit ${i} Score`];
            const el = document.getElementById(`u${i}-score`);
            if (el) {
                el.innerText = (score !== null && score !== undefined) ? `${score}/5 🏆` : "لم تبدأ";
            }
        }
    }

    function switchPlayMode(mode) {
        const pridePanel = document.getElementById('pride-panel');
        if (mode === 'mom') {
            document.body.classList.add('mom-mode-active');
            pridePanel.style.display = 'block';
            document.getElementById('btn-solo').className = 'mode-btn';
            document.getElementById('btn-mom').className = 'mode-btn active-mom';
        } else {
            document.body.classList.remove('mom-mode-active');
            pridePanel.style.display = 'none';
            document.getElementById('btn-solo').className = 'mode-btn active-solo';
            document.getElementById('btn-mom').className = 'mode-btn';
        }
    }

    function launchUnit(unit) { 
        window.location.href = `unit${unit}.html`; 
    }
</script>
</body>
</html>
