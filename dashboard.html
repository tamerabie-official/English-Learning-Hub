<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - English Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #e3f2fd, #fff9c4); min-height: 100vh; text-align: center; margin: 0; padding-bottom: 30px; }
        .welcome-section { background: #1976d2; color: white; padding: 30px 10px; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .student-name { color: #ffeb3b; font-size: 1.8rem; font-weight: bold; display: block; margin-top: 10px; }
        .side-img { width: 120px; position: fixed; bottom: 0; z-index: -1; }
        #tom { left: 10px; }
        #jerry { right: 10px; }
        .unit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 30px; max-width: 600px; margin: auto; }
        .unit-card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; border: 3px solid #ff9800; }
        .unit-card:hover { transform: translateY(-10px); background-color: #fffde7; }
    </style>
</head>
<body>

    <!-- الشخصيات المرافقة -->
    <img src="25009.jpg" id="tom" class="side-img" alt="Tom">
    <img src="25010.jpg" id="jerry" class="side-img" alt="Jerry">

    <div class="welcome-section">
        <h1>مرحباً بك في عالم المعرفة! 🌟</h1>
        <span id="displayStudentName" class="student-name">أهلاً بك يا بطل</span>
        <p>استعد لاستكشاف وحدات منهجك الممتعة</p>
    </div>

    <div class="unit-grid">
        <div class="unit-card" onclick="window.location.href='phonics_unit1.html'">
            <div style="font-size: 3rem;">🏫</div>
            <b style="font-size: 1.2rem;">Unit 1: My School</b>
        </div>
        <div class="unit-card" onclick="window.location.href='phonics_unit2.html'">
            <div style="font-size: 3rem;">🎨</div>
            <b style="font-size: 1.2rem;">Unit 2: Colors</b>
        </div>
    </div>

    <script>
        const studentName = localStorage.getItem('studentName');
        if (studentName) {
            document.getElementById('displayStudentName').innerText = "يا بطلنا: " + studentName;
        } else {
            // إعادة توجيه إذا لم يقم الطالب بتسجيل الدخول
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
