<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - English Learning Hub 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e); /* تصميم مظلم سينمائي أنيق يناسب الهوية المرئية للمنصة */
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid #00f2fe;
            border-radius: 25px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: #00f2fe;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .welcome-msg {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #fff;
        }

        .welcome-msg span {
            color: #4facfe;
            font-weight: bold;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        .menu-btn {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #1a1a2e;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .logout-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            margin-top: 30px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>مرحباً بك في English Learning Hub 🌟</h1>
    <div class="welcome-msg">أهلاً بالبطل: <span id="student-name-display">جاري التحميل...</span> 👋</div>
    
    <!-- أزرار التحكم والدروس المستقبلية للمنصة -->
    <div class="menu-grid">
        <button class="menu-btn" onclick="goToLessons()">📖 ابدأ رحلة التعلم والدروس</button>
        <button class="menu-btn" onclick="goToQuiz()">📝 اختبار تحديد المستوى التشخيصي</button>
        <button class="menu-btn" onclick="viewReport()">📊 تقرير الأداء وأسلوب الاستيعاب</button>
    </div>

    <button class="logout-btn" onclick="logout()">تسجيل الخروج 🚪</button>
</div>

<script>
    // عند تحميل الصفحة، نقرأ اسم الطالب المنسوخ في ذاكرة المتصفح فورا لتظهر لوحة التحكم مخصصة له
    document.addEventListener("DOMContentLoaded", function() {
        const storedName = localStorage.getItem('studentName');
        
        if (storedName) {
            document.getElementById('student-name-display').innerText = storedName;
        } else {
            // حماية أمنية: إذا حاول أحد الدخول للوحة التحكم مباشرة دون تسجيل، يعيده لصفحة البداية
            alert("تنبيه: الرجاء تسجيل الدخول أولاً.");
            window.location.href = "index.html";
        }
    });

    function goToLessons() {
    window.location.href = "lessons.html";
    
    }

    function goToQuiz() {
    window.location.href = "Quiz.html";
}

    function viewReport() {
        alert("ميزة استخراج تقرير الذكاءات وأسلوب الاستيعاب قيد التجهيز! 📊");
    }

    function logout() {
        // مسح اسم الطالب من الذاكرة والعودة لصفحة التسجيل
        localStorage.removeItem('studentName');
        window.location.href = "index.html";
    }
</script>

</body>
</html>
