<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب - English Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f8e9; padding: 20px; color: #1b5e20; }
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn-save { background: #1976d2; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>📝 تسجيل بيانات Hub</h2>
        <p>أدخل البيانات لبدء التعلم مع Maya و Hana [10، 11].</p>
        <input type="text" id="studentName" placeholder="اسم الطالب الثلاثي" style="width:100%; padding:10px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
        <input type="tel" id="whatsapp" placeholder="رقم الواتساب للتقارير" style="width:100%; padding:10px; margin:10px 0; border-radius:10px; border:1px solid #ccc;">
        <button class="btn-save" onclick="saveData()">حفظ والبدء</button>
    </div>
    <!-- كود الـ Script الخاص بـ Firebase يوضع هنا كما فعلنا سابقاً -->
</body>
</html>
