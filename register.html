<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب - English Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f8e9; padding: 20px; text-align: center; }
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-family: 'Cairo', sans-serif; }
        .btn-save { background: #1976d2; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>📝 انضم إلى Hub!</h2>
        <p>سجل بياناتك للبدء مع Maya و Hana [11، 27].</p>
        
        <input type="text" id="studentName" placeholder="اسم الطالب الثلاثي">
        <input type="tel" id="whatsapp" placeholder="رقم الواتساب">
        
        <button class="btn-save" onclick="saveData()">حفظ والبدء 🚀</button>
    </div>

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
      // تأكد من وضع بيانات مشروعك الحقيقية هنا من Firebase Console
      const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "your-project.firebaseapp.com",
        databaseURL: "https://your-project.firebaseio.com",
        projectId: "your-project-id",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:12345:web:abcde"
      };

      // تهيئة Firebase
      firebase.initializeApp(firebaseConfig);
      var database = firebase.database();

      function saveData() {
        const studentName = document.getElementById('studentName').value;
        const whatsapp = document.getElementById('whatsapp').value;

        if(!studentName || !whatsapp) {
            alert("أستاذي، يرجى ملء جميع الخانات أولاً [10، 11].");
            return;
        }

        // إرسال البيانات لقاعدة البيانات التي ضبطنا قواعدها في المصدر 24582
        database.ref('students/').push({
            name: studentName,
            phone: whatsapp,
            timestamp: new Date().getTime()
        })
        .then(() => {
            alert("تم الحفظ! استعد لدروس الصوتيات Tt و Ii [8، 26].");
            window.location.href = "dashboard.html";
        })
        .catch((error) => {
            alert("خطأ: " + error.message);
        });
      }
    </script>
</body>
</html>
