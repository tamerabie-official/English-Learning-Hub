<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل Hub - English Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f8e9; padding: 20px; text-align: center; }
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ccc; font-family: 'Cairo', sans-serif; }
        
        /* تنسيق كلمة المرور الملونة [1، 15] */
        .color-password-label { margin-top: 15px; font-weight: bold; color: #1976d2; }
        .color-grid { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-opt { width: 50px; height: 50px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.3s; }
        .red { background-color: #f44336; } .blue { background-color: #2196f3; }
        .green { background-color: #4caf50; } .yellow { background-color: #ffeb3b; }
        .selected { border-color: #333; transform: scale(1.1); }

        .btn-save { background: #ff9800; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 1.2rem; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>📝 انضم إلى عائلة Hub!</h2>
        <p>املأ البيانات لنبدأ رحلة التعلم مع Maya و Hana [11، 27].</p>
        
        <input type="text" id="studentName" placeholder="اسم الطالب الثلاثي">
        <input type="text" id="username" placeholder="اسم المستخدم (Username)">
        <input type="tel" id="whatsapp" placeholder="رقم واتساب ولي الأمر">
        
        <div class="color-password-label">اختر لونك المفضل (كلمة المرور) 🎨</div>
        <div class="color-grid" id="colorPicker">
            <div class="color-opt red" onclick="selectColor('Red', this)"></div>
            <div class="color-opt blue" onclick="selectColor('Blue', this)"></div>
            <div class="color-opt green" onclick="selectColor('Green', this)"></div>
            <div class="color-opt yellow" onclick="selectColor('Yellow', this)"></div>
        </div>
        <input type="hidden" id="selectedColor" value="">

        <button class="btn-save" onclick="saveData()">حفظ والبدء 🚀</button>
    </div>

    <!-- Firebase Library -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY", 
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      firebase.initializeApp(firebaseConfig);
      var database = firebase.database();

      function selectColor(color, element) {
          // مسح الاختيار السابق
          document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('selected'));
          // تحديد اللون الجديد
          element.classList.add('selected');
          document.getElementById('selectedColor').value = color;
      }

      function saveData() {
        const name = document.getElementById('studentName').value;
        const user = document.getElementById('username').value;
        const phone = document.getElementById('whatsapp').value;
        const pass = document.getElementById('selectedColor').value;

        if(!name || !user || !phone || !pass) {
            alert("يرجى إكمال كافة البيانات واختيار لونك المفضل! [10، 11]");
            return;
        }

        database.ref('students/' + user).set({
            fullName: name,
            username: user,
            whatsapp: phone,
            visualPassword: pass, // الربط بنواتج تعلم الألوان [1، 15]
            progress: "Unit 1 Started"
        })
        .then(() => {
            alert("تم التسجيل بنجاح! تذكر لونك هو: " + pass);
            window.location.href = "dashboard.html";
        })
        .catch((error) => alert("خطأ: " + error.message));
      }
    </script>
</body>
