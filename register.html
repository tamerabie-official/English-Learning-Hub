
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد - Connect 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f8e9; padding: 20px; color: #1b5e20; }
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #c8e6c9; border-radius: 10px; box-sizing: border-box; }
        .btn-save { background: #4caf50; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 1.1rem; cursor: pointer; }
        .label { font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>📝 بيانات الرحلة التعليمية</h2>
        <p>يرجى إدخال البيانات المختصرة للبدء [11، 14].</p>
        
        <label class="label">اسم الطالب الثلاثي:</label>
        <input type="text" id="studentName" placeholder="مثال: أحمد محمد علي">

        <label class="label">اسم ولي الأمر:</label>
        <input type="text" id="parentName" placeholder="الأب / الأم">

        <label class="label">رقم الواتساب (للتقارير):</label>
        <input type="tel" id="whatsapp" placeholder="01xxxxxxxxx">

        <label class="label">اختر كلمة مرور مرئية (لطفلك):</label>
        <select id="visualPassword">
            <option value="circle_red">دائرة حمراء 🔴</option>
            <option value="square_blue">مربع أزرق 🟦</option>
            <option value="triangle_yellow">مثلث أصفر 🟡</option>
        </select>

        <button class="btn-save" onclick="saveData()">حفظ البيانات والبدء</button>
    </div>

    <script>
        function saveData() {
            const name = document.getElementById('studentName').value;
            if(name) {
                alert("أهلاً بك يا " + name + "! تم حفظ بياناتك بنجاح وسننتقل للوحدة الأولى.");
                // هنا سيتم الربط برمز Firebase لاحقاً للتخزين الفعلي
            } else {
                alert("يرجى إدخال الاسم أولاً.");
            }
        }
    </script>

</body>
</html>
