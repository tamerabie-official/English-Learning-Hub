<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
  // ١. تأكد من استبدال هذه القيم ببيانات مشروعك الحقيقية من Firebase Console
  const firebaseConfig = {
    apiKey: "AIzaSyDmyzp_sbDsYw7oHnlHRsetIoUGu5opUHo", 
    authDomain: "english-learning-hub-98454.firebaseapp.com",
    databaseURL: "https://english-learning-hub-98454-default-rtdb.firebaseio.com",
    projectId: "english-learning-hub-98454",
    storageBucket: "english-learning-hub-98454.firebasestorage.app",
    messagingSenderId: "152809776123",
    appId: "1:152809776123:web:ba5dd15e9189dda4f7e15e"
  };

  // تهيئة Firebase مع تنبيه في حال وجود خطأ في الإعدادات
  try {
      firebase.initializeApp(firebaseConfig);
      var database = firebase.database();
      console.log("Firebase Initialized Successfully");
  } catch (error) {
      alert("خطأ في إعدادات Firebase: " + error.message);
  }

  function saveData() {
    const studentName = document.getElementById('studentName').value;
    const whatsapp = document.getElementById('whatsapp').value;
    const visualPassword = document.getElementById('visualPassword').value;

    if(!studentName || !whatsapp) {
        alert("من فضلك أدخل الاسم ورقم الواتساب أولاً [10، 11].");
        return;
    }

    alert("جاري محاولة حفظ البيانات في Hub... انتظر لحظة.");

    // محاولة الحفظ مع معالجة الأخطاء (Error Handling)
    database.ref('students/').push({
        name: studentName,
        phone: whatsapp,
        password: visualPassword, // الأشكال والألوان من الوحدة الثانية [1، 15]
        progress: "Unit 1 Not Started",
        timestamp: new Date().getTime()
    })
    .then(() => {
        alert("تم الحفظ بنجاح! مرحباً بك في English Learning Hub.");
        window.location.href = "dashboard.html"; // الانتقال للوحة التحكم
    })
    .catch((error) => {
        // هذا الجزء سيخبرنا إذا كانت المشكلة في قواعد البيانات (Rules)
        alert("فشل الحفظ! السبب: " + error.message);
        console.error(error);
    });
  }
</script>
