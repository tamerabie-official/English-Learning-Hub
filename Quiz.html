<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تحديد المستوى البسيط 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid #00f2fe;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
            text-align: center;
            margin-top: 20px;
        }

        h2 { color: #00f2fe; font-size: 1.5rem; margin-bottom: 20px; }
        
        .progress-bar {
            width: 100%;
            background-color: #333;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 10px;
            width: 20%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.4rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .emoji-img {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #1a1a2e;
            font-weight: bold;
            transform: scale(1.02);
        }

        .result-box {
            display: none;
        }

        .score-text {
            font-size: 1.8rem;
            color: #ffdf00;
            margin: 20px 0;
            font-weight: bold;
        }

        .back-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- واجهة الأسئلة -->
    <div id="quiz-area">
        <h2 id="question-number">السؤال 1 من 5</h2>
        <div class="progress-bar">
            <div class="progress" id="quiz-progress"></div>
        </div>
        
        <div class="question-box">
            <span class="emoji-img" id="question-emoji">🍎</span>
            <span id="question-text">ما هو الحرف الأول لهذه الصورة؟</span>
        </div>

        <div class="options-grid" id="options-container">
            <!-- الأزرار ستتغير برمجياً هنا -->
        </div>
    </div>

    <!-- واجهة النتيجة النهائية -->
    <div id="result-area" class="result-box">
        <h2>🎉 أحسنت يا بطل! تم الانتهاء</h2>
        <p>لقد قمت بإنهاء اختبار التشخيص بنجاح.</p>
        <div class="score-text">درجتك هي: <span id="final-score">0</span> / 5</div>
        <p id="evaluation-msg" style="color: #00f2fe; font-weight: bold;"></p>
        <button class="back-btn" onclick="returnToDashboard()">العودة للوحة التحكم 🏠</button>
    </div>
</div>

<!-- استدعاء سوبابيز لحفظ النتيجة للطلاب -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // بيانات الأسئلة التأسيسية المخصصة لـ KG1 & KG2
    const questions = [
        { emoji: "🍎", text: "Choose the first letter for: (Apple)", options: ["A", "B", "C"], correct: "A" },
        { emoji: "🐱", text: "What is this animal?", options: ["Dog", "Cat", "Fish"], correct: "Cat" },
        { emoji: "🔴", text: "What color is this?", options: ["Blue", "Green", "Red"], correct: "Red" },
        { emoji: "🚗", text: "Choose the correct spelling:", options: ["Car", "Van", "Bus"], correct: "Car" },
        { emoji: "🔢", text: "What comes after number Two (2)?", options: ["One", "Three", "Four"], correct: "Three" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    function getSupabaseClient() {
        const url = 'https://cjpdnptndkceescvubmg.supabase.co';
        const key = 'Sb_publishable_Jbwm_t_ycZprbYmfV5HrPw_CAtZ-m6B';
        return supabase.createClient(url, key);
    }

    function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        
        // تحديث رقم السؤال والتقدم
        document.getElementById('question-number').innerText = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
        document.getElementById('quiz-progress').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        
        // تحديث النص والرموز
        document.getElementById('question-emoji').innerText = currentQuestion.emoji;
        document.getElementById('question-text').innerText = currentQuestion.text;
        
        // توليد الاختيارات
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQuestion.options.forEach(option => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = option;
            button.onclick = () => checkAnswer(option);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedOption) {
        if (selectedOption === questions[currentQuestionIndex].correct) {
            score++;
        }
        
        currentQuestionIndex++;
        
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    async function showResults() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        // صياغة رسالة تقييم تربوية بناء على مجموع الإجابات
        let evalMsg = "";
        if(score >= 4) {
            evalMsg = "المستوى ممتااااز ومستعد للبدء فوراً! 🌟";
        } else if(score >= 2) {
            evalMsg = "مستوى متوسط، يحتاج مراجعة سريعة على أساسيات الصوتيات والحروف. 📚";
        } else {
            evalMsg = "يحتاج خطة تأسيسية كاملة من الصفر (الحروف والأصوات أولاً). ⚠️";
        }
        document.getElementById('evaluation-msg').innerText = evalMsg;

        // 🚀 حفظ النتيجة والتقييم في جدول الطلاب بسوبابيز بناءً على اسم الطالب
        const studentName = localStorage.getItem('studentName');
        if (studentName) {
            const client = getSupabaseClient();
            if (client) {
                await client.from('students')
                    .update({ 
                        'Quiz Score': `${score}/5`,
                        'Evaluation': evalMsg 
                    })
                    .eq('Full Name', studentName);
            }
        }
    }

    function returnToDashboard() {
        window.location.href = "Dashboard.html";
    }

    // بدء تشغيل أول سؤال فور فتح الصفحة
    document.addEventListener("DOMContentLoaded", loadQuestion);
</script>
</body>
</html>
