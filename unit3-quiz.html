<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشعر فحص الأدوات - Unit 3 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: #f8fafc; min-height: 100vh; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .quiz-box {
            width: 100%; max-width: 500px;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px);
            border: 2px solid #38bdf8; border-radius: 25px; padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); text-align: center;
        }

        h2 { color: #38bdf8; font-size: 1.4rem; margin-bottom: 20px; }
        
        .progress-container { width: 100%; background: #1e293b; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 10px; width: 20%; background: linear-gradient(90deg, #38bdf8, #0288d1); transition: width 0.3s; }

        .question-text { font-size: 1.25rem; margin-bottom: 25px; font-weight: bold; }
        .emoji-view { font-size: 4rem; margin-bottom: 15px; display: block; }

        .options-list { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.05); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12); padding: 14px;
            border-radius: 15px; font-family: 'Cairo', sans-serif; font-size: 1.05rem;
            cursor: pointer; transition: all 0.2s;
        }
        .opt-btn:hover { background: linear-gradient(45deg, #38bdf8, #0288d1); color: #0f172a; font-weight: bold; }

        .score-display { font-size: 1.8rem; color: #38bdf8; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-box">
    <div id="quiz-screen">
        <h2 id="q-counter">مستشعر فحص سؤال 1 من 5</h2>
        <div class="progress-container"><div class="progress-fill" id="p-bar"></div></div>
        
        <div class="question-text">
            <span class="emoji-view" id="q-emoji">🎒</span>
            <span id="q-txt">تحميل شفرة السؤال الجاري...</span>
        </div>
        <div class="options-list" id="opts-box"></div>
    </div>

    <div id="result-screen" style="display: none;">
        <h2>📊 تم إنهاء التقييم التكنولوجي للمستودع!</h2>
        <div class="score-display">مستوى الدقة: <span id="f-score">0</span> / 5</div>
        <p id="eval-text" style="color: #38bdf8; font-weight: bold;"></p>
        <button style="background:#22c55e; color:white; border:none; padding:12px 30px; border-radius:15px; font-family:'Cairo'; font-weight:bold; cursor:pointer; margin-top:20px;" onclick="window.location.href='dashboard.html'">تأكيد التقرير والعودة 🏠</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const dataSet = [
        { emoji: "🎒", text: "Complete the mission: Deploy your ______.", options: ["Bag", "Ruler", "Pen"], correct: "Bag" },
        { emoji: "📏", text: "What is the name of this scanning device?", options: ["Pencil", "Ruler", "Sharpener"], correct: "Ruler" },
        { emoji: "🤖", text: "Choose the starting letter for: (Robot)", options: ["P", "B", "R"], correct: "R" },
        { emoji: "🐼", text: "What sound code does (Panda) start with?", options: ["P", "R", "H"], correct: "P" },
        { emoji: "👝", text: "Where do we store the plasma pens?", options: ["Pencil case", "Bag", "Book"], correct: "Pencil case" }
    ];

    let qIndex = 0; let totalScore = 0;

    function initClient() {
        return supabase.createClient('https://cjpdnptndkceescvubmg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM');
    }

    function showQuestion() {
        const q = dataSet[qIndex];
        document.getElementById('q-counter').innerText = `مستشعر فحص سؤال ${qIndex + 1} من ${dataSet.length}`;
        document.getElementById('p-bar').style.width = `${((qIndex + 1) / dataSet.length) * 100}%`;
        document.getElementById('q-emoji').innerText = q.emoji;
        document.getElementById('q-txt').innerText = q.text;
        
        const box = document.getElementById('opts-box'); box.innerHTML = '';
        q.options.forEach(o => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = o;
            b.onclick = () => { if(o === q.correct) totalScore++; qIndex++; if(qIndex < dataSet.length) showQuestion(); else saveReport(); };
            box.appendChild(b);
        });
    }

    async function saveReport() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('f-score').innerText = totalScore;

        let msg = totalScore >= 4 ? "رائع! ترسانة العميل السري جاهزة ومكتملة الفهم 🚀" : "مستوى متوسط، يرجى إعادة فحص الكلمات الصوتية 📚";
        document.getElementById('eval-text').innerText = msg;

        const name = localStorage.getItem('studentName');
        if (name) {
            const sClient = initClient();
            await sClient.from('students').update({ 'Unit 3 Score': `${totalScore}/5`, 'Unit 3 Evaluation': msg }).eq('Full Name', name);
        }
    }

    document.addEventListener("DOMContentLoaded", showQuestion);
</script>
</body>
</html>
