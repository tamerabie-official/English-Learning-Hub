<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوحدة 2: ماسح البصمة الحيوية 👁️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f172a, #0369a1);
            color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; }
        .scanner-hud { background: rgba(15, 23, 42, 0.6); border: 2px solid #38bdf8; border-radius: 30px; padding: 20px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); text-align: center; }
        
        /* تأثير رادار الماسح الضوئي البصري */
        .scan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .scan-node {
            background: rgba(255,255,255,0.03); border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px; padding: 15px; cursor: pointer; transition: all 0.2s;
        }
        .scan-node:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); transform: translateY(-3px); }
        .node-emoji { font-size: 2.5rem; display: block; }
        .node-name { font-weight: bold; margin-top: 5px; font-size: 1.1rem; color: #38bdf8; }

        .status-terminal { background: #020617; border-radius: 15px; padding: 12px; font-family: monospace; color: #22c55e; text-align: left; direction: ltr; min-height: 40px; margin-bottom: 20px; font-size: 0.9rem; }
        .nav-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 30px; border-radius: 50px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #38bdf8; margin: 0;">🧬 الفصل 2: بصمة مستشعرات الجسد</h2>
        <p style="color:#94a3b8; font-size:0.9rem;" id="mode-text">المس العضو لتفعيل مستشعرات التوجيه بالمركبة الفضائية</p>
    </div>

    <div class="scanner-hud">
        <div class="status-terminal" id="terminal">SYSTEM READY. AWAITING BIOMETRIC INPUT...</div>
        
        <div class="scan-grid">
            <div class="scan-node" onclick="triggerScan('Eye', 'عين ذكية')">
                <span class="node-emoji">👁️</span><span class="node-name">Eye</span>
            </div>
            <div class="scan-node" onclick="triggerScan('Nose', 'أنف الاستشعار')">
                <span class="node-emoji">👃</span><span class="node-name">Nose</span>
            </div>
            <div class="scan-node" onclick="triggerScan('Ear', 'مستقبل الصوت (أذن)')">
                <span class="node-emoji">👂</span><span class="node-name">Ear</span>
            </div>
            <div class="scan-node" onclick="triggerScan('Mouth', 'مخرج الشفرات (فم)')">
                <span class="node-emoji">👄</span><span class="node-name">Mouth</span>
            </div>
        </div>

        <button class="nav-btn" style="background:#e11d48; color:white; margin-bottom:10px;" onclick="verifyBiometrics()">تثبيت وفحص التوافق الحيوي 📡</button>
    </div>

    <button class="nav-btn" style="margin-top:20px; display:block; margin-left:auto; margin-right:auto; background:transparent; color:#94a3b8; border:1px solid rgba(255,255,255,0.2);" onclick="window.location.href='dashboard.html'">الخروج للخريطة 🏠</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const isMom = localStorage.getItem('gameMode') === 'mom';
    const studentName = localStorage.getItem('studentName') || 'البطل';
    
    if(isMom) {
        document.getElementById('mode-text').innerText = "وضع ماما نشط: المس العضو على وجه ماما ثم اضغط على الشاشة!";
    }

    function triggerScan(en, ar) {
        document.getElementById('terminal').innerText = `SCANNING > [${en.toUpperCase()}] SUCCESS. ALIGNED WITH: ${ar}`;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(en); u.lang = 'en-US'; window.speechSynthesis.speak(u);
    }

    async function verifyBiometrics() {
        alert("🚀 تم مطابقة الخلايا والبيانات بنجاح! طاقة المركبة تزداد الكفاءة 100%");
        const supabaseUrl = 'https://cjpdnptndkceescvubmg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM';
        const db = supabase.createClient(supabaseUrl, supabaseKey);
        await db.from('students').update({ 'Unit 2 Score': '5/5' }).eq('Full Name', studentName);
        window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
