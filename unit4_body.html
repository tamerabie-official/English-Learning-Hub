<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوحدة 4: جسمي وحواسي - English Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #e0f7fa; margin: 0; padding: 20px; text-align: center; }
        .unit-header { background: #0097a7; color: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0, 151, 167, 0.3); }
        .section-title { color: #006064; margin-top: 30px; border-bottom: 2px solid #4dd0e1; display: inline-block; padding-bottom: 5px; }
        
        /* شبكة أعضاء الجسم [2، 17، 25] */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .card { background: white; padding: 15px; border-radius: 20px; border: 2px solid #4dd0e1; cursor: pointer; transition: 0.3s; }
        .card:active { transform: scale(0.9); background: #b2ebf2; }
        .card span { display: block; font-size: 2.5rem; }
        .label { font-weight: bold; color: #00796b; margin-top: 10px; }

        /* معمل الصوتيات (Rr, Ee, Cc, Kk) [2، 24] */
        .phonics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .letter-btn { background: #00acc1; color: white; padding: 12px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="unit-header">
        <h1>👁️ Unit 4: My Body and My Senses</h1>
        <p>اكتشف جسمك وحواسك الخمس مع Hub [2، 17]</p>
    </div>

    <h3 class="section-title">أجزاء الجسم (Body Parts)</h3>
    <div class="grid">
        <div class="card" onclick="speak('I have one head')"><span>👤</span><div class="label">Head</div></div>
        <div class="card" onclick="speak('I have two eyes')"><span>👀</span><div class="label">Eyes</div></div>
        <div class="card" onclick="speak('I have two ears')"><span>👂</span><div class="label">Ears</div></div>
        <div class="card" onclick="speak('I have one nose')"><span>👃</span><div class="label">Nose</div></div>
        <div class="card" onclick="speak('I have one mouth')"><span>👄</span><div class="label">Mouth</div></div>
        <div class="card" onclick="speak('I have two hands')"><span>🙌</span><div class="label">Hands</div></div>
    </div>

    <h3 class="section-title">الحواس الخمس (My 5 Senses)</h3>
    <div class="grid">
        <div class="card" onclick="speak('I can see with my eyes')"><span>🔍</span><div class="label">See</div></div>
        <div class="card" onclick="speak('I can hear with my ears')"><span>🎧</span><div class="label">Hear</div></div>
        <div class="card" onclick="speak('I can smell with my nose')"><span>🌹</span><div class="label">Smell</div></div>
        <div class="card" onclick="speak('I can taste with my tongue')"><span>🍦</span><div class="label">Taste</div></div>
        <div class="card" onclick="speak('I can touch with my hands')"><span>🧸</span><div class="label">Touch</div></div>
    </div>

    <h3 class="section-title">معمل الصوتيات (Phonics Lab)</h3>
    <p>استمع لأصوات الحروف الجديدة [2، 24]</p>
    <div class="phonics-grid">
        <button class="letter-btn" onclick="speak('R, R, Red, Rabbit, Rocket')">Rr</button>
        <button class="letter-btn" onclick="speak('E, E, Egg, Elephant, Elbow')">Ee</button>
        <button class="letter-btn" onclick="speak('C, C, Cat, Cake, Cup')">Cc</button>
        <button class="letter-btn" onclick="speak('K, K, Kite, King, Kitchen')">Kk</button>
    </div>

    <br><br>
    <button onclick="window.location.href='dashboard.html'" style="padding:15px 30px; border-radius:25px; border:none; background:#333; color:white; cursor:pointer; font-weight:bold;">العودة للوحة التحكم</button>

    <script>
        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }
    </script>

</body>
</html>
