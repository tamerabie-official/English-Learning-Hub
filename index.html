<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The English Learning Hub - بوابة الإطلاق 🌌</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-gold: #f59e0b;
            --cyber-purple: #a855f7;
            --space-dark: #090514;
            --ahly-red: #cc0000;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e1145 0%, var(--space-dark) 100%);
            color: #f8fafc; margin: 0; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .launchpad-card {
            width: 100%; max-width: 480px;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px);
            border: 2px solid rgba(168, 85, 247, 0.3); border-radius: 30px; padding: 30px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); text-align: center;
            box-sizing: border-box;
        }

        .brand-logo { font-size: 3rem; margin-bottom: 10px; }
        h1 { font-size: 1.8rem; font-weight: 900; margin: 0; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin: 10px 0 25px 0; }

        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-weight: bold; color: var(--neon-gold); margin-bottom: 8px; font-size: 0.9rem; }
        .input-cyber {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 14px; box-sizing: border-box; color: #fff; font-family: 'Cairo'; font-size: 1.05rem; text-align: center;
            transition: all 0.3s;
        }
        .input-cyber:focus { border-color: var(--cyber-purple); outline: none; background: rgba(255, 255, 255, 0.08); }

        /* شبكة الأبطال والبدلات المفرغة */
        .avatar-label { text-align: right; font-weight: bold; color: var(--neon-gold); font-size: 0.9rem; margin-bottom: 12px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .avatar-option {
            background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px; padding: 10px; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .avatar-preview { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 2.2rem; background: rgba(255,255,255,0.05); overflow: hidden; background-size: cover; background-position: center; }
        .avatar-option p { margin: 8px 0 0 0; font-size: 0.75rem; color: #94a3b8; font-weight: bold; line-height: 1.3; }
        .avatar-option.selected { border-color: var(--neon-gold); background: rgba(245, 158, 11, 0.08); }
        
        .upload-trigger { font-size: 0.65rem; color: var(--cyber-purple); display: block; margin-top: 4px; text-decoration: underline; }
        .hidden-file { display: none; }

        .btn-launch {
            width: 100%; background: linear-gradient(90deg, #7c3aed, #f59e0b); color: white; border: none;
            padding: 16px; font-family: 'Cairo'; font-weight: 900; font-size: 1.2rem; border-radius: 50px; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-launch:active { transform: scale(0.98); }
        
        .status-msg { margin-top: 15px; font-size: 0.9rem; font-weight: bold; min-height: 22px; }
        .error-color { color: #ef4444; }

        .suit-thumb { height: 60px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); background-size: cover; background-position: center; cursor: pointer; transition: border-color 0.2s; }
        .suit-thumb.active { border-color: #f59e0b; }
    </style>
</head>
<body>

<div class="launchpad-card">
    <div class="brand-logo">🚀</div>
    <h1>مركبة المعرفة الكونية</h1>
    <div class="subtitle">قم بإدخال بيانات العبور واختر بدلتك المفضلة لبدء التحدي!</div>

    <!-- 📋 صندوق التسجيل للطلاب الجدد -->
    <div id="register-section" style="text-align: right; background: rgba(255,255,255,0.01); padding: 15px; border-radius: 20px; border: 1px solid rgba(245, 158, 11, 0.2); margin-bottom: 25px;">
        <h2 style="color: #f59e0b; font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">📋 التسجيل (طالب جديد)</h2>
        
        <div class="input-group">
            <input type="text" id="reg-name" class="input-cyber" placeholder="👤 الاسم الثلاثي للبطل">
        </div>
        <div class="input-group" style="margin-top: 12px;">
            <input type="text" id="reg-username" class="input-cyber" placeholder="🔑 اختر اسم مستخدم (Username)" style="direction: ltr;">
        </div>
        <div class="input-group" style="margin-top: 12px;">
            <input type="tel" id="reg-whatsapp" class="input-cyber" placeholder="📱 رقم الواتساب الخاص بماما">
        </div>
        
        <!-- اختيار المظهر والبدلة المفضلة -->
        <div class="avatar-label" style="margin-top: 15px;">🛸 حدد بطلك المفضل:</div>
        <div class="avatar-grid">
            <!-- البطل 1: رائد فضاء بالصور المفرغة (الأولى ديفولت) -->
            <div class="avatar-option selected" id="opt-hero1" onclick="openSuitInventory()">
                <div class="avatar-preview" id="main-suit-preview" style="background-image: url('25116.jpg');"></div>
                <p>البدلة الفضائية</p>
            </div>

            <!-- البطل 2: كرتون AI تفاعلي -->
            <div class="avatar-option" id="opt-hero2" onclick="selectHero(2, '')">
                <div class="avatar-preview" id="prev-2">🤖</div>
                <p>بطل كرتوني</p>
                <span class="upload-trigger" onclick="triggerUpload(event, 'file-hero2')">رفع الصورة</span>
                <input type="file" id="file-hero2" class="hidden-file" accept="image/*" onchange="handleImageUpload(this, 2)">
            </div>

            <!-- البطل 3: بطل النادي الأهلي (الفانيلة الحمراء الديفولت) -->
            <div class="avatar-option" id="opt-hero3" onclick="selectHero(3, '🦅🔴')">
                <div class="avatar-preview" id="prev-3" style="background: var(--ahly-red); color: white; font-size:1.4rem; font-weight:900; border-radius:12px;">𓄂🦅</div>
                <p>النادي الأهلي</p>
                <span class="upload-trigger" onclick="triggerUpload(event, 'file-hero3')">دمج الوجه</span>
                <input type="file" id="file-hero3" class="hidden-file" accept="image/*" onchange="handleImageUpload(this, 3)">
            </div>
        </div>

        <!-- مخزن البدلات المفرغة -->
        <div id="suit-inventory-box" style="margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 20px; border: 1px dashed rgba(168, 85, 247, 0.4);">
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                <div class="suit-thumb active" onclick="setSuit('25116.jpg', this)" style="background-image: url('25116.jpg');"></div>
                <div class="suit-thumb" onclick="setSuit('25117.jpg', this)" style="background-image: url('25117.jpg');"></div>
                <div class="suit-thumb" onclick="setSuit('25118.jpg', this)" style="background-image: url('25118.jpg');"></div>
                <div class="suit-thumb" onclick="setSuit('25119.jpg', this)" style="background-image: url('25119.jpg');"></div>
            </div>
        </div>
        
        <button class="btn-launch" onclick="registerStudent()">تأكيد التسجيل الجديد 🚀</button>
        <div id="reg-success-msg" class="status-msg" style="text-align: center;"></div>
    </div>

    <!-- خط فاصل بامتياز سينمائي -->
    <div style="margin: 25px 0; display: flex; align-items: center; text-align: center; color: #4b5563; font-size: 0.85rem; font-weight: bold;">
        <div style="flex: 1; border-bottom: 1px dashed #4b5563;"></div>
        <span style="padding: 0 15px;">أو</span>
        <div style="flex: 1; border-bottom: 1px dashed #4b5563;"></div>
    </div>

    <!-- 🔐 صندوق الدخول السريع للمسجلين سابقاً -->
    <div id="login-section" style="text-align: right; background: rgba(255,255,255,0.01); padding: 15px; border-radius: 20px; border: 1px solid rgba(168, 85, 247, 0.2);">
        <h2 style="color: #a855f7; font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">🔐 دخول سريع (مسجل سابقاً)</h2>
        
        <div class="input-group">
            <input type="text" id="login-username" class="input-cyber" placeholder="اكتب اسم المستخدم (Username)" style="direction: ltr;">
        </div>
        
        <button class="btn-launch" style="background: linear-gradient(90deg, #475569, #334155); margin-top: 15px;" onclick="loginStudent()">دخول إلى المركبة 🌌</button>
    </div>
</div>

<!-- 📦 مكتبة Supabase يتم تحميلها من سطر واحد سليم ومقاوم للانحناء -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 🧠 الكود البرمجي الموحد والخالي من أخطاء المسارات -->
<script>
    const urlSupabase = 'https://cjpdnptndkceescvubmg.supabase.co';
    const keySupabase = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM';
    let clientDb;

    let activeHeroType = 1;
    let selectedSuitFile = '25116.jpg';

    document.addEventListener("DOMContentLoaded", function() {
        if (typeof supabase !== 'undefined') {
            clientDb = supabase.createClient(urlSupabase, keySupabase);
        } else {
            console.error("Supabase library not loaded properly!");
        }
        localStorage.setItem('studentAvatarImg', selectedSuitFile);
    });

    function openSuitInventory() { 
        selectHero(1, selectedSuitFile); 
        const box = document.getElementById('suit-inventory-box');
        if(box) box.style.display = 'block';
    }

    function setSuit(fileName, el) {
        document.querySelectorAll('.suit-thumb').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        selectedSuitFile = fileName;
        
        const preview = document.getElementById('main-suit-preview');
        if(preview) preview.style.backgroundImage = `url('${fileName}')`;
        
        localStorage.setItem('studentAvatarImg', fileName);
    }

    function triggerUpload(e, id) { 
        e.stopPropagation(); 
        document.getElementById(id).click(); 
    }

    function handleImageUpload(input, type) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                if(type === 2) { localStorage.setItem('uploadedHero2', base64Img); selectHero(2, base64Img); }
                if(type === 3) { localStorage.setItem('uploadedHero3', base64Img); selectHero(3, base64Img); }
                alert("✨ تم استلام الصورة بنجاح ودمجها مع نظام البطل الذكي!");
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function selectHero(type, val) {
        activeHeroType = type;
        document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
        document.getElementById(`opt-hero${type}`).classList.add('selected');
        
        const box = document.getElementById('suit-inventory-box');
        if (type !== 1) {
            if(box) box.style.display = 'none';
            localStorage.setItem('studentAvatarImg', val);
        } else {
            if(box) box.style.display = 'block';
            localStorage.setItem('studentAvatarImg', selectedSuitFile);
        }
    }

    async function registerStudent() {
        const name = document.getElementById('reg-name').value.trim();
        const user = document.getElementById('reg-username').value.trim();
        const phone = document.getElementById('reg-whatsapp').value.trim();
        const msgDiv = document.getElementById('reg-success-msg');

        if (!name || !user || !phone) { 
            alert("🚨 يرجى ملء كافة حقول التسجيل (الاسم، اسم المستخدم، ورقم الواتساب)!"); 
            return; 
        }

        msgDiv.style.color = "#f59e0b";
        msgDiv.innerText = "⏳ جاري فحص وتأمين حسابك في الفضاء...";

        try {
            const { data, error } = await clientDb.from('students').insert([
                { 'Full Name': name, 'Username': user, 'WhatsApp Number': phone, 'Avatar': `Hero Style ${activeHeroType}` }
            ]);

            if (error) {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "🚨 اسم المستخدم هذا محجوز مسبقاً! اختر اسماً آخر.";
            } else {
                msgDiv.style.color = "#10b981";
                msgDiv.innerText = `✅ تم التسجيل بنجاح! (اسم المستخدم الخاص بك هو: ${user})`;
                
                localStorage.setItem('studentName', name);
                localStorage.setItem('username', user);
                localStorage.setItem('whatsappNum', phone);
                localStorage.setItem('heroType', activeHeroType);
                
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
            }
        } catch(e) {
            console.error(e);
            msgDiv.style.color = "#ef4444";
            msgDiv.innerText = "🚨 فشل الاتصال بالمفاعل الرئيسي، حاول مجدداً.";
        }
    }

    async function loginStudent() {
        const user = document.getElementById('login-username').value.trim();
        
        if (!user) { 
            alert("🚨 يرجى إدخال اسم المستخدم الخاص بك لتشغيل محركات العبور!"); 
            return; 
        }

        try {
            const { data, error } = await clientDb
                .from('students')
                .select('*')
                .eq('Username', user);

            if (data && data.length > 0) {
                localStorage.setItem('username', user);
                localStorage.setItem('studentName', data[0]['Full Name']);
                localStorage.setItem('whatsappNum', data[0]['WhatsApp Number']);
                localStorage.setItem('studentAvatarImg', data[0]['Avatar'] || '25116.jpg');
                
                window.location.href = 'dashboard.html';
            } else {
                alert("❌ عذراً! اسم المستخدم هذا غير مسجل. يرجى التسجيل في المربع العلوي أولاً.");
            }
        } catch(e) {
            console.error(e);
            alert("🚨 عذراً، هناك مشكلة في شبكة الإنترنت، حاول مجدداً.");
        }
    }
</script>
</body>
</html>
