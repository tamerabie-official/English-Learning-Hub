<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في English Learning Hub 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #e3f2fd, #fff9c4); 
            min-height: 100vh; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%;
            max-width: 430px; 
            margin: auto; 
        }

        /* 1. مربع تسجيل ولي الأمر */
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 30px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            border: 3px solid #ff9800; 
            transition: 0.3s;
        }
        .box h3 { margin-top: 0; color: #ff9800; }
        
        /* تصميم المدخلات العام */
        input { 
            width: 85%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 15px; 
            border: 2px solid #ddd; 
            outline: none; 
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }
        input:focus { border-color: #ff9800; }
        
        button { 
            background: #4caf50; 
            color: white; 
            padding: 10px 30px; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            font-family: 'Cairo', sans-serif;
            margin-top: 5px;
        }

        /* المسافة الفاصلة */
        .spacer { height: 20px; }

        /* 2. مربع ميكي ماوس لفورم الطالب */
        .mickey-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 400px;
            background-image: url('25015.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0 auto;
        }

        .mickey-form {
            position: absolute;
            top: 63%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mickey-form h3 { 
            margin: 0 0 12px 0; 
            color: #d32f2f; 
            font-size: 1.1rem;
        }
        
        .mickey-form input { 
            width: 95%; 
            padding: 10px; 
            margin: 6px 0; 
            font-size: 0.9rem;
            border: 2px solid #d32f2f;
            border-radius: 12px;
        }
        
        .mickey-form button { 
            background: #d32f2f; 
            padding: 10px 25px; 
            font-size: 0.9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. مربع التسجيل لولي الأمر -->
    <div class="box">
        <h3>للتسجيل (ولي الأمر) 📝</h3>
        <input type="text" id="p_studentName" placeholder="اسم الطالب الثلاثي">
        <input type="text" id="p_username" placeholder="اسم المستخدم للطالب">
        <input type="tel" id="p_whatsapp" placeholder="رقم واتساب ولي الأمر">
        <button onclick="registerStudent()">تسجيل الطالب</button>
    </div>

    <div class="spacer"></div>

    <!-- 2. مربع ميكي ماوس لفورم الطالب -->
    <div class="mickey-container">
        <div class="mickey-form">
            <h3>مسجل بالفعل! 🎓</h3>
            <input type="text" id="s_username" placeholder="أدخل اسم المستخدم">
            <button onclick="loginStudent()">دخول للتعلم</button>
        </div>
    </div>

</div>

<!-- استدعاء المكتبة الخارجية -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // الدالة المحدثة: ضع مفتاحك الجديد المنسوخ بالأسفل هنا
    function getSupabaseClient() {
        if (typeof supabase === 'undefined') {
            alert("تنبيه: لم يتم تحميل مكتبة قاعدة البيانات بعد. تأكد من اتصالك بالإنترنت ثم حدّث الصفحة.");
            return null;
        }
        
        const url = 'https://cjpdnptndkceescvubmg.supabase.co';
        
        // ⚠️ امسح النص المكتوب بالأسفل بالكامل وضَعْ بدله الـ Anon Key الطويل الذي نسخته
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM';
        
        return supabase.createClient(url, key);
    }

    async function registerStudent() {
        const fullName = document.getElementById('p_studentName').value.trim();
        const username = document.getElementById('p_username').value.trim();
        const whatsapp = document.getElementById('p_whatsapp').value.trim();

        if(!fullName || !username || !whatsapp) {
            alert("الرجاء ملء جميع الحقول أولاً.");
            return;
        }

        const client = getSupabaseClient();
        if (!client) return; 

        try {
            const { data: userCheck, error: userErr } = await client.from('students').select('*').eq('User name', username);
            if (userErr) { alert("فشل فحص الحساب: " + userErr.message); return; }
            if (userCheck && userCheck.length > 0) { alert("اختار اسم مستخدم آخر."); return; }

            const { data: nameCheck, error: nameErr } = await client.from('students').select('*').eq('Full Name', fullName);
            if (nameErr) { alert("فشل فحص الاسم: " + nameErr.message); return; }
            if (nameCheck && nameCheck.length > 0) { alert("الاسم مسجل سابقا."); return; }

            const { data: phoneCheck, error: phoneErr } = await client.from('students').select('*').eq('WhatsApp', whatsapp);
            if (phoneErr) { alert("فشل فحص الهاتف: " + phoneErr.message); return; }
            if (phoneCheck && phoneCheck.length > 0) { alert("رقم الجوال مسجل سابقا."); return; }

            const { error: insertErr } = await client.from('students').insert([{
                'Full Name': fullName,
                'User name': username,
                'WhatsApp': whatsapp
            }]);
            
            if(insertErr) {
                alert("خطأ أثناء إدخال البيانات: " + insertErr.message);
            } 

        } catch (err) {
            alert("حدث خطأ غير متوقع في النظام: " + err.message);
        } else {
    alert("تم التسجيل بنجاح! اسم المستخدم الخاص بك هو: (" + username + ")");
    
    // حفظ الاسم في ذاكرة المتصفح لكي ترحب به لوحة التحكم فوراً
    localStorage.setItem('studentName', fullName);
    
    // الانتقال التلقائي إلى لوحة التحكم
    window.location.href = "dashboard.html";
}
    }

    async function loginStudent() {
        const user = document.getElementById('s_username').value.trim();
        
        if(!user) {
            alert("الرجاء إدخال اسم المستخدم الخاص بك.");
            return;
        }

        const client = getSupabaseClient();
        if (!client) return;

        try {
            const { data, error } = await client.from('students').select('*').eq('User name', user).single();
            
            if (error) {
                alert("اسم المستخدم غير صحيح أو الطالب غير مسجل.");
                return;
            }

            if (data) {
                localStorage.setItem('studentName', data['Full Name']);
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            alert("حدث خطأ أثناء محاولة الدخول: " + err.message);
        }
    }
</script>
</body>
</html>
