
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كونكت - الصف الأول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #e0f2f1; text-align: center; margin: 0; color: #2e7d32; }
        .header { background: linear-gradient(135deg, #4caf50, #81c784); color: white; padding: 40px 20px; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .content { padding: 30px 20px; }
        .character-box { margin: 20px auto; padding: 20px; background: white; border-radius: 25px; width: 85%; box-shadow: 0 6px 12px rgba(0,0,0,0.05); border: 2px dashed #4caf50; }
        .btn-start { background: #ff9800; color: white; padding: 18px 45px; border: none; border-radius: 35px; font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 80%; }
        .footer-note { font-size: 0.85rem; color: #757575; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>أهلاً بك في مدرسة طفلك الرقمية! 🎓</h1>
        <p>الرفيق الذكي لمنهج Connect 2026</p>
    </div>
    <div class="content">
        <div class="character-box">
            <h2>Maya و Hana بانتظارك!</h2>
            <p>ابدأ رحلة التعلم الممتعة مع الحروف والأرقام بأسلوب تفاعلي حديث [4، 17].</p>
        </div>
        <h3>هل ولي الأمر مستعد للبدء؟</h3>
        <button class="btn-start" onclick="goToRegistration()">ابدأ التسجيل الآن</button>
        <div class="footer-note">تم تطويره وفقاً لإطار وزارة التربية والتعليم 2026 [2، 15].</div>
    </div>
    <script>
        function goToRegistration() {
            alert("رائع! سننتقل الآن لإدخال البيانات المختصرة (الاسم، الواتساب، صلة القرابة).");
        }
    </script>
</body>
</html>
