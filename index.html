<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مرحباً بك في English Learning Hub 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #e3f2fd, #fff9c4); min-height: 100vh; text-align: center; padding: 20px; margin: 0; }
        .hero-img { width: 220px; margin: 10px; border-radius: 20px; }
        .side-img { width: 120px; position: fixed; bottom: 0; z-index: -1; }
        #tom { left: 10px; }
        #jerry { right: 10px; }
        .container { max-width: 450px; margin: auto; }
        .box { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 25px; border: 3px solid #ff9800; transition: 0.3s; }
        .box:hover { transform: translateY(-5px); }
        input { width: 85%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 2px solid #ddd; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff9800; }
        button { background: #4caf50; color: white; padding: 12px 35px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<!-- الصور التزيينية -->
<img src="25009.jpg" id="tom" class="side-img" alt="Tom">
<img src="25010.jpg" id="jerry" class="side-img" alt="Jerry">

<div class="container">
    <img src="25012.jpg" class="hero-img" alt="Learning together">
    <h1>مرحباً بك في Hub! 🌟</h1>

    <!-- 1. مربع التسجيل -->
    <div class="box">
        <h3>للتسجيل (ولي الأمر) 📝</h3>
        <input type="text" id="p_studentName" placeholder="اسم الطالب الثلاثي">
        <input type="text" id="p_username" placeholder="اسم المستخدم">
        <input type="tel" id="p_whatsapp" placeholder="رقم واتساب ولي الأمر">
        <button onclick="registerStudent()">تسجيل الطالب</button>
    </div>

    <!-- 2. مربع الدخول -->
    <div class="box" style="border-color: #1976d2;">
        <h3 style="color: #1976d2;">مسجل بالفعل! 🎓</h3>
        <input type="text" id="s_username" placeholder="أدخل اسم المستخدم">
        <button onclick="loginStudent()" style="background: #1976d2;">دخول للتعلم</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabase = supabase.createClient('https://cjpdnptndkceescvubmg.supabase.co', 'Sb_publishable_Jbwm_t_ycZprbYmfV5HrPw_CAtZ-m6B');

    async function registerStudent() {
        const { error } = await supabase.from('students').insert([{
            full_name: document.getElementById('p_studentName').value,
            username: document.getElementById('p_username').value,
            whatsapp: document.getElementById('p_whatsapp').value
        }]);
        if(error) alert("خطأ: " + error.message);
        else alert("تم التسجيل بنجاح! يمكن للطالب الدخول الآن.");
    }

    async function loginStudent() {
        const user = document.getElementById('s_username').value;
        const { data, error } = await supabase.from('students').select('*').eq('username', user).single();
        
        if (data) {
            localStorage.setItem('studentName', data.full_name);
            window.location.href = "dashboard.html";
        } else {
            alert("عذراً، الطالب غير مسجل. الرجاء التسجيل أولاً.");
        }
    }
</script>
</body>
</html>
