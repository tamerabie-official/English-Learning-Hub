<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في English Learning Hub 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #e3f2fd, #fff9c4); 
            min-height: 100vh; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%;
            max-width: 430px; 
            margin: auto; 
        }

        /* 1. مربع تسجيل ولي الأمر */
        .box { 
            background: white; 
            padding: 20px; 
            border-radius: 30px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            border: 3px solid #ff9800; 
            transition: 0.3s;
        }
        .box h3 { margin-top: 0; color: #ff9800; }
        
        /* تصميم المدخلات العام */
        input { 
            width: 85%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 15px; 
            border: 2px solid #ddd; 
            outline: none; 
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }
        input:focus { border-color: #ff9800; }
        
        button { 
            background: #4caf50; 
            color: white; 
            padding: 10px 30px; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem; 
            font-family: 'Cairo', sans-serif;
            margin-top: 5px;
        }

        /* المسافة الفاصلة */
        .spacer { height: 20px; }

        /* 2. مربع ميكي ماوس لفورم الطالب */
        .mickey-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 400px;
            background-image: url('25015.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0 auto;
        }

        .mickey-form {
            position: absolute;
            top: 63%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mickey-form h3 { 
            margin: 0 0 12px 0; 
            color: #d32f2f; 
            font-size: 1.1rem;
        }
        
        .mickey-form input { 
            width: 95%; 
            padding: 10px; 
            margin: 6px 0; 
            font-size: 0.9rem;
            border: 2px solid #d32f2f;
            border-radius: 12px;
        }
        
        .mickey-form button { 
            background: #d32f2f; 
            padding: 10px 25px; 
            font-size: 0.9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. مربع التسجيل لولي الأمر -->
    <div class="box">
        <h3>للتسجيل (ولي الأمر) 📝</h3>
        <input type="text" id="p_studentName" placeholder="اسم الطالب الثلاثي">
        <input type="text" id="p_username" placeholder="اسم المستخدم للطالب">
        <input type="tel" id="p_whatsapp" placeholder="رقم واتساب ولي الأمر">
        <button onclick="registerStudent()">تسجيل الطالب</button>
    </div>

    <div class="spacer"></div>

    <!-- 2. مربع ميكي ماوس لفورم الطالب -->
    <div class="mickey-container">
        <div class="mickey-form">
            <h3>مسجل بالفعل! 🎓</h3>
            <input type="text" id="s_username" placeholder="أدخل اسم المستخدم">
            <button onclick="loginStudent()">دخول للتعلم</button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseClient = supabase.createClient('https://cjpdnptndkceescvubmg.supabase.co', 'Sb_publishable_Jbwm_t_ycZprbYmfV5HrPw_CAtZ-m6B');

    async function registerStudent() {
        const fullName = document.getElementById('p_studentName').value.trim();
        const username = document.getElementById('p_username').value.trim();
        const whatsapp = document.getElementById('p_whatsapp').value.trim();

        if(!fullName || !username || !whatsapp) {
            alert("الرجاء ملء جميع الحقول أولاً.");
            return;
        }

        try {
            // 1. التحقق من تكرار اسم المستخدم
            const { data: userCheck } = await supabaseClient.from('students').select('*').eq('User name', username);
            if (userCheck && userCheck.length > 0) {
                alert("اختار اسم مستخدم آخر.");
                return;
            }

            // 2. التحقق من تكرار الاسم الثلاثي للطالب
            const { data: nameCheck } = await supabaseClient.from('students').select('*').eq('Full Name', fullName);
            if (nameCheck && nameCheck.length > 0) {
                alert("الاسم مسجل سابقا.");
                return;
            }

            // 3. التحقق من تكرار رقم الجوال
            const { data: phoneCheck } = await supabaseClient.from('students').select('*').eq('WhatsApp', whatsapp);
            if (phoneCheck && phoneCheck.length > 0) {
                alert("رقم الجوال مسجل سابقا.");
                return;
            }

            // إرسال الـ 3 أعمدة الأساسية المتبقية فقط بنجاح ونقاء تامين
            const { error } = await supabaseClient.from('students').insert([{
                'Full Name': fullName,
                'User name': username,
                'WhatsApp': whatsapp
            }]);
            
            if(error) {
                alert("خطأ أثناء التسجيل: " + error.message);
            } else {
                alert("تم التسجيل بنجاح! اسم المستخدم الخاص بك هو: (" + username + ")");
                
                // تفريغ خانات الكتابة بعد النجاح
                document.getElementById('p_studentName').value = '';
                document.getElementById('p_username').value = '';
                document.getElementById('p_whatsapp').value = '';
            }

        } catch (err) {
            alert("حدث خطأ غير متوقع: " + err.message);
        }
    }

    async function loginStudent() {
        const user = document.getElementById('s_username').value.trim();
        
        if(!user) {
            alert("الرجاء إدخال اسم المستخدم الخاص بك.");
            return;
        }

        const { data, error } = await supabaseClient.from('students').select('*').eq('User name', user).single();
        
        if (data) {
            localStorage.setItem('studentName', data['Full Name']);
            window.location.href = "dashboard.html";
        } else {
            alert("اسم المستخدم غير صحيح أو الطالب غير مسجل.");
        }
    }
</script>
</body>
</html>
