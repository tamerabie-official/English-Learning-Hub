
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الألوان والأشكال - Connect 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #e1f5fe; text-align: center; margin: 0; padding: 20px; }
        .game-box { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        #shape-display { font-size: 80px; margin: 30px 0; transition: 0.3s; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .color-btn { border: none; border-radius: 15px; height: 60px; cursor: pointer; color: white; font-weight: bold; font-size: 1.1rem; }
        .red { background-color: #f44336; } .blue { background-color: #2196f3; }
        .green { background-color: #4caf50; } .yellow { background-color: #ffeb3b; color: #333; }
        #feedback { margin-top: 20px; font-weight: bold; font-size: 1.2rem; min-height: 30px; }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>🎨 تحدي الألوان!</h2>
        <p>اسمع السؤال واختر اللون الصحيح [1، 9].</p>
        
        <div id="shape-display">❓</div>
        <div id="feedback"></div>

        <div class="options-grid">
            <button class="color-btn red" onclick="checkAnswer('red')">Red</button>
            <button class="color-btn blue" onclick="checkAnswer('blue')">Blue</button>
            <button class="color-btn green" onclick="checkAnswer('green')">Green</button>
            <button class="color-btn yellow" onclick="checkAnswer('yellow')">Yellow</button>
        </div>

        <button onclick="nextQuestion()" style="margin-top:20px; padding:10px 20px; border-radius:15px;">السؤال التالي ➡️</button>
    </div>

    <script>
        const questions = [
            { text: "The flower is red", color: "red", shape: "🌸" },
            { text: "The sky is blue", color: "blue", shape: "☁️" },
            { text: "The grass is green", color: "green", shape: "🌱" },
            { text: "The sun is yellow", color: "yellow", shape: "☀️" }
        ];

        let currentQ = {};

        function nextQuestion() {
            currentQ = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('shape-display').innerText = currentQ.shape;
            document.getElementById('feedback').innerText = "";
            speak(currentQ.text); // نطق الجملة التعليمية [9، 23]
        }

        function checkAnswer(choice) {
            const feedback = document.getElementById('feedback');
            if(choice === currentQ.color) {
                feedback.innerText = "رائع! Great Job! 🎉";
                feedback.style.color = "green";
            } else {
                feedback.innerText = "حاول مرة أخرى.. Try again!";
                feedback.style.color = "red";
            }
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text; msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        // بدء اللعبة تلقائياً
        window.onload = nextQuestion;
    </script>
</body>
</html>
