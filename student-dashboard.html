<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-2xl font-bold">مرحباً، يا بطل! 🌟</h1>
            <p class="text-slate-400">لنكمل رحلتنا في تعلم الإنجليزية اليوم.</p>
        </div>
        <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center font-bold">ت</div>
    </header>

    <main class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- قسم التقدم (اللون الأخضر للنمو) -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-emerald-500/30">
            <h2 class="text-emerald-400 font-bold mb-4">تقدمك الحالي</h2>
            <div class="relative pt-1">
                <div class="flex mb-2 items-center justify-between">
                    <div><span class="text-xs font-semibold inline-block text-emerald-200">المستوى: 1</span></div>
                    <div class="text-right"><span class="text-xs font-semibold inline-block text-emerald-200">75%</span></div>
                </div>
                <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-emerald-900">
                    <div style="width:75%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-emerald-500"></div>
                </div>
            </div>
        </section>

        <!-- قسم الألعاب (اللون البرتقالي للحماس) -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-orange-500/30 cursor-pointer hover:scale-105 transition-transform" onclick="window.location.href='exercises.html'">
            <h2 class="text-orange-400 font-bold mb-4">تحديات اليوم 🎮</h2>
            <p class="text-slate-300 text-sm">ألعاب سريعة لتنشيط عقلك بكلمات الوحدة الأولى.</p>
            <button class="mt-4 w-full bg-orange-500 hover:bg-orange-600 py-2 rounded-lg font-bold">ابدأ اللعب</button>
        </section>

        <!-- قسم الدروس (اللون الأزرق للتركيز) -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-blue-500/30">
            <h2 class="text-blue-400 font-bold mb-4">درس اليوم 📚</h2>
            <p class="text-slate-300 text-sm">تعلم الكلمات الجديدة بأحدث أساليبنا.</p>
            <button class="mt-4 w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-bold">ابدأ الدرس</button>
        </section>

    </main>

    <!-- قائمة المهام -->
    <footer class="p-6">
        <h3 class="text-xl font-bold mb-4">المهام المطلوبة منك:</h3>
        <ul class="space-y-3">
            <li class="bg-slate-800 p-4 rounded-xl flex items-center justify-between border-l-4 border-emerald-500">
                <span>إتمام تحدي "النمر والأسد"</span>
                <span class="text-emerald-400 text-sm">✓ تم</span>
            </li>
            <li class="bg-slate-800 p-4 rounded-xl flex items-center justify-between border-l-4 border-blue-500">
                <span>مشاهدة فيديو "Hello!"</span>
                <button class="bg-blue-600 px-4 py-1 rounded text-sm">شاهد</button>
            </li>
        </ul>
    </footer>

</body>
</html>
