<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار قياس طاقة البطل - Unit 2 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 2px solid #ff9800;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(255, 152, 0, 0.15);
            text-align: center;
            margin-top: 20px;
        }

        h2 { color: #ff9800; font-size: 1.5rem; margin-bottom: 20px; }
        
        .progress-bar {
            width: 100%;
            background-color: #334155;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            height: 10px;
            width: 20%;
            background: linear-gradient(90deg, #ff9800, #f57c00);
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .emoji-img {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: linear-gradient(45deg, #ff9800, #e65100);
            color: #0f172a;
            font-weight: bold;
            transform: scale(1.02);
        }

        .result-box { display: none; }
        .score-text { font-size: 1.8rem; color: #ffd700; margin: 20px 0; font-weight: bold; }
        
        .back-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-area">
        <h2 id="question-number">مستشعر السؤال 1 من 5</h2>
        <div class="progress-bar">
            <div class="progress" id="quiz-progress"></div>
        </div>
        
        <div class="question-box">
            <span class="emoji-img" id="question-emoji">👁️</span>
            <span id="question-text">تحميل السؤال...</span>
        </div>

        <div class="options-grid" id="options-container"></div>
    </div>

    <div id="result-area" class="result-box">
        <h2>🎉 تم فحص شحنة الطاقة بنجاح!</h2>
        <p>لقد أنهيت اختبار تقييم الوحدة الثانية بنجاح مذهل.</p>
        <div class="score-text">مستوى الطاقة: <span id="final-score">0</span> / 5</div>
        <p id="evaluation-msg" style="color: #ff9800; font-weight: bold;"></p>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">العودة للوحة التحكم 🏠</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // الأسئلة خارج الصندوق لتقييم أهداف الوحدة الثانية بدقة
    const questions = [
        { emoji: "👁️", text: "Complete the superpower command: Touch your ______.", options: ["Ear", "Eye", "Nose"], correct: "Eye" },
        { emoji: "👃", text: "What is the name of this scent tracker?", options: ["Mouth", "Hand", "Nose"], correct: "Nose" },
        { emoji: "✋", text: "Choose the first letter for: (Hand)", options: ["N", "H", "M"], correct: "H" },
        { emoji: "🥜", text: "What letter does this energy food (Nut) start with?", options: ["H", "B", "N"], correct: "N" },
        { emoji: "👄", text: "What is this member used for communication?", options: ["Mouth", "Ear", "Hair"], correct: "Mouth" }
    ];

    let currentQuestionIndex = 0; let score = 0;

    function getSupabaseClient() {
        const url = 'https://cjpdnptndkceescvubmg.supabase.co';
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM';
        return supabase.createClient(url, key);
    }

    function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        document.getElementById('question-number').innerText = `مستشعر السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
        document.getElementById('quiz-progress').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        document.getElementById('question-emoji').innerText = currentQuestion.emoji;
        document.getElementById('question-text').innerText = currentQuestion.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQuestion.options.forEach(option => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = option;
            button.onclick = () => checkAnswer(option);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedOption) {
        if (selectedOption === questions[currentQuestionIndex].correct) { score++; }
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) { loadQuestion(); } 
        else { showResults(); }
    }

    async function showResults() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = score;

        let evalMsg = "";
        if(score >= 4) { evalMsg = "رائع! رادار طاقة البطل لديك يعمل بكفاءة 100% 🚀"; } 
        else if(score >= 2) { evalMsg = "مستوى طاقة جيد، يحتاج البطل لمراجعة سريعة على شفرات الصوتيات 📚"; } 
        else { evalMsg = "تحذير طاقة منخفضة! يرجى إعادة الاستماع للمساعد الإيقاعي الصوتي ⚠️"; }
        document.getElementById('evaluation-msg').innerText = evalMsg;

        const studentName = localStorage.getItem('studentName');
        if (studentName) {
            const client = getSupabaseClient();
            if (client) {
                // حفظ نتيجة كويز الوحدة الثانية بشكل مستقل داخل قاعدة البيانات
                await client.from('students')
                    .update({ 
                        'Unit 2 Score': `${score}/5`,
                        'Unit 2 Evaluation': evalMsg 
                    })
                    .eq('Full Name', studentName);
            }
        }
    }

    document.addEventListener("DOMContentLoaded", loadQuestion);
</script>
</body>
</html>
