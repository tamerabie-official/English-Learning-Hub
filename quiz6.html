<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي مصنع الحلوى - اختبار 6 🍬🍭</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --candy-pink: #f43f5e;
            --bg-candy: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
            --candy-text: #881337;
        }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg-candy);
            color: var(--candy-text); margin: 0; padding: 15px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .candy-wrapper {
            width: 100%; max-width: 440px; background: white;
            border: 4px solid var(--candy-pink); border-radius: 30px;
            padding: 20px; box-sizing: border-box; box-shadow: 0 12px 25px rgba(244,63,94,0.1);
        }
        .banner-icon { font-size: 3.5rem; text-align: center; margin-bottom: 5px; }
        
        .progress-box { width: 100%; height: 10px; background: #ffe4e6; border-radius: 50px; margin-bottom: 20px; overflow: hidden; }
        .progress-candy-fill { width: 33.3%; height: 100%; background: var(--candy-pink); transition: width 0.3s; }

        .q-candy-title { font-size: 1.2rem; font-weight: 900; text-align: center; margin-bottom: 20px; color: var(--candy-text); }
        
        .grid-candy { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-candy {
            background: #fff5f5; border: 2px dashed #fda4af; border-radius: 20px;
            padding: 14px; text-align: center; font-family: 'Cairo'; font-weight: bold;
            font-size: 1.05rem; color: var(--candy-text); cursor: pointer; transition: all 0.2s;
        }
        .btn-candy.correct-pop { background: #10b981 !important; border-style: solid !important; border-color: #34d399 !important; color: white; font-weight: 900; }
        .btn-candy.wrong-pop { background: #ef4444 !important; border-style: solid !important; border-color: #f87171 !important; color: white; }

        .candy-end-panel { display: none; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 15px;">
    <h1 style="font-size: 1.3rem; margin: 0; color: var(--candy-pink);">🍬 مصنع النغمات السكرية:  🍭</h1>
    <p style="font-size: 0.85rem; font-weight: bold; color: #9f1239; margin-top: 4px;">املأ سلة الحلويات بالإجابات الصحيحة !</p>
</div>

<div class="candy-wrapper">
    <div id="candy-play-zone">
        <div class="banner-icon">🍬🍭🍫</div>
        <div class="progress-box"><div class="progress-candy-fill" id="candy-bar"></div></div>
        
        <div class="q-candy-title" id="candy-question">جاري تجهيز ماكينة فرز السكاكر ...</div>
        <div class="grid-candy" id="candy-options"></div>
    </div>

    <div id="candy-score-zone" class="candy-end-panel">
        <h1 style="font-size: 4rem; margin: 0;">🍩🏆</h1>
        <h2 style="color: var(--candy-pink); font-weight: 900;" id="candy-feedback">ذكاء بطعم الفراولة الشقية!</h2>
        <p style="font-weight: bold; color: #9f1239;">تم تأمين الدرجة وإضافتها إلى حساب سوبابيز الخاص بك بنجاح 🚀</p>
        <button onclick="window.location.href='dashboard.html'" style="background: var(--candy-pink); color: white; border: none; padding: 12px 35px; font-family: 'Cairo'; font-weight: 900; border-radius: 50px; cursor: pointer; margin-top: 15px;">طيران للوحة التحكم 🛸</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const dbClient = supabase.createClient('https://cjpdnptndkceescvubmg.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGRucHRuZGtjZWVzY3Z1Ym1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTExNTYsImV4cCI6MjA5ODU4NzE1Nn0.psxah2ekfvgZ5ReTutudYg59fiSrX13dI8IkJCobGMM');

    const u6Questions = [
        { q: "عندما تريد أن تقول بالإنجليزية : (أنا أستطيع العزف على الطبلة) نختار؟", answers: ["I can play the drum", "I can play the guitar", "Hello drum"], correct: 0 },
        { q: "أي كلمة تبدأ بصوت حرف الـ (G) ؟", answers: ["Drum", "Guitar", "Doll"], correct: 1 },
        { q: "ما هي الآلة الموسيقية التي تسمى بالإنجليزية (Violin)؟", answers: ["الكمان", "البيانو", "العود"], correct: 0 }
    ];

    let candyIdx = 0; let candyPoints = 0;
    const activeStudent = localStorage.getItem('Username');

    function loadCandyQuestion() {
        if(candyIdx >= u6Questions.length) { saveCandyData(); return; }
        
        document.getElementById('candy-bar').style.width = `${((candyIdx + 1) / u6Questions.length) * 100}%`;
        const itemQ = u6Questions[candyIdx];
        document.getElementById('candy-question').innerText = itemQ.q;
        
        const area = document.getElementById('candy-options');
        area.innerHTML = '';
        
        itemQ.answers.forEach((ans, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-candy';
            btn.innerText = ans;
            btn.onclick = () => checkCandySelection(idx, btn);
            area.appendChild(btn);
        });
    }

    function checkCandySelection(chosen, element) {
        const itemQ = u6Questions[candyIdx];
        const buttons = document.querySelectorAll('.btn-candy');
        buttons.forEach(b => b.disabled = true);
        
        if(chosen === itemQ.correct) {
            element.classList.add('correct-pop');
            candyPoints++;
        } else {
            element.classList.add('wrong-pop');
            buttons[itemQ.correct].classList.add('correct-pop');
        }
        candyIdx++;
        setTimeout(loadCandyQuestion, 1200);
    }

    async function saveCandyData() {
        document.getElementById('candy-play-zone').style.display = 'none';
        document.getElementById('candy-score-zone').style.display = 'block';
        
        const scaledCandy = Math.round((candyPoints / u6Questions.length) * 5);
        document.getElementById('candy-feedback').innerText = `رائع جداً! نتيجتك الحلوة: ${scaledCandy}/5 🏆`;
        
        if (activeStudent) {
            await dbClient
                .from('students')
                .update({ 'Unit 6 Score': scaledCandy })
                .eq('Username', activeStudent);
        }
    }

    window.onload = loadCandyQuestion;
</script>
</body>
</html>
