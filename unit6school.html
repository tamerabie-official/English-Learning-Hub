<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الوحدة 6: مدرستي - English Hub</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #e8f5e9; margin: 0; padding: 20px; text-align: center; }
        .unit-header { background: #2e7d32; color: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 20px; border: 2px solid #81c784; cursor: pointer; transition: 0.3s; }
        .card:active { transform: scale(0.95); background: #c8e6c9; }
        .card span { display: block; font-size: 2.5rem; }
        .label { font-weight: bold; color: #1b5e20; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="unit-header">
        <h1>📚 Unit 6: My School</h1>
        <p>تعرف على أدوات المدرسة مع English Learning Hub</p>
    </div>

    <div class="grid">
        <div class="card" onclick="speak('Book')"><span>📘</span><div class="label">Book</div></div>
        <div class="card" onclick="speak('Pen')"><span>✏️</span><div class="label">Pen</div></div>
        <div class="card" onclick="speak('Teacher')"><span>👩‍🏫</span><div class="label">Teacher</div></div>
        <div class="card" onclick="speak('Student')"><span>👦👩</span><div class="label">Student</div></div>
    </div>

    <script>
        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.85;
            window.speechSynthesis.speak(msg);
        }
    </script>

</body>
</html>
