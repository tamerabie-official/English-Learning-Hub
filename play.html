<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Frenzy 🐯</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #fceb00, #ff9800);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-area {
            width: 100%;
            max-width: 500px;
            height: 70vh;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .element {
            position: absolute;
            font-size: 3rem;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .element:active { transform: scale(0.8); }

        #score-board {
            font-size: 2rem;
            font-weight: bold;
            color: #d84315;
            margin-top: 10px;
            text-shadow: 2px 2px #fff;
        }
    </style>
</head>
<body>

    <div id="score-board">النقاط: 0</div>
    <div id="game-area"></div>

    <script>
        const gameArea = document.getElementById('game-area');
        const scoreBoard = document.getElementById('score-board');
        let score = 0;
        const elements = ['🐯', '🦁', '🌳']; // النمر، الأسد، الشجرة

        function createItem() {
            const item = document.createElement('div');
            item.className = 'element';
            item.innerText = elements[Math.floor(Math.random() * elements.length)];
            
            // الموقع العشوائي
            item.style.left = Math.random() * (gameArea.offsetWidth - 50) + 'px';
            item.style.top = '-50px';
            
            gameArea.appendChild(item);

            // حركة النزول
            let speed = 2 + Math.random() * 3;
            let top = -50;
            
            let move = setInterval(() => {
                top += speed;
                item.style.top = top + 'px';
                
                if (top > gameArea.offsetHeight) {
                    clearInterval(move);
                    gameArea.removeChild(item);
                }
            }, 20);

            // التفاعل
            item.onclick = () => {
                if (item.innerText !== '🌳') {
                    score += 10;
                    scoreBoard.innerText = 'النقاط: ' + score;
                    gameArea.removeChild(item);
                    clearInterval(move);
                } else {
                    // لمس الشجرة يقلل النقاط
                    score = Math.max(0, score - 5);
                    scoreBoard.innerText = 'النقاط: ' + score;
                    item.style.filter = 'grayscale(100%)'; // رد فعل بصري
                }
            };
        }

        // إنشاء عناصر جديدة كل 800 مللي ثانية
        setInterval(createItem, 800);
    </script>
</body>
</html>
