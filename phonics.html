<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الصوتيات الذكي 🎙️✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6366f1;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --bg-dark: #0f172a;
            --accent-orange: #f59e0b;
        }
        body {
            font-family: 'Cairo', sans-serif; background: var(--bg-dark);
            color: white; margin: 0; padding: 15px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .header-zone { text-align: center; margin-bottom: 15px; }
        .header-zone h1 { font-size: 1.4rem; color: #a5b4fc; font-weight: 900; margin: 0; }
        
        /* أدوات التحكم واختيار الوحدات */
        .selector-container {
            width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;
        }
        .styled-select {
            background: #1e293b; color: white; border: 2px solid var(--primary-purple);
            padding: 10px; border-radius: 15px; font-family: 'Cairo'; font-weight: bold; font-size: 1rem; outline: none;
        }
        
        /* تبويبات الفئة: أساسي / اختياري */
        .category-tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .tab-btn {
            background: #1e293b; color: #94a3b8; border: 2px solid #334155; padding: 10px;
            border-radius: 12px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active-tab {
            background: var(--primary-purple); color: white; border-color: #818cf8;
        }

        /* تنويه الكلمات الخارجية */
        .disclaimer-box {
            display: none; width: 100%; max-width: 420px; background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--accent-orange); color: #fef08a; padding: 10px;
            border-radius: 12px; text-align: center; font-size: 0.85rem; font-weight: bold; margin-bottom: 15px;
            box-sizing: border-box;
        }

        .phonics-card {
            width: 100%; max-width: 420px; background: #1e293b;
            border: 3px solid var(--primary-purple); border-radius: 25px;
            padding: 25px 20px; box-sizing: border-box; text-align: center;
            box-shadow: 0 15px 30px rgba(99,102,241,0.2);
        }

        .word-display { font-size: 2.8rem; font-weight: 900; color: #f8fafc; margin: 10px 0; letter-spacing: 1px; }
        .word-translation { font-size: 1.1rem; color: #94a3b8; margin-bottom: 25px; }

        .control-btns { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .action-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            font-size: 1.8rem; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s; color: white;
        }
        .btn-listen { background: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        .btn-record { background: var(--neon-red); box-shadow: 0 0 15px rgba(239,68,68,0.4); }
        .action-btn:active { transform: scale(0.9); }
        
        .recording-active { animation: pulseMic 1.2s infinite; background: #b91c1c !important; }
        @keyframes pulseMic { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

        .feedback-box {
            min-height: 55px; border-radius: 15px; background: #0f172a;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 900; padding: 10px; box-sizing: border-box;
        }
        .status-idle { color: #64748b; font-weight: normal; font-size: 1rem; }
        .status-success { color: var(--neon-green); text-shadow: 0 0 10px rgba(16,185,129,0.3); }
        .status-fail { color: #f59e0b; text-shadow: 0 0 10px rgba(245,158,11,0.3); }

        .nav-navigators { display: flex; justify-content: space-between; margin-top: 20px; width: 100%; max-width: 420px; }
        .nav-step-btn { background: #334155; border: 1px solid #475569; color: white; padding: 10px 20px; border-radius: 12px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; }
        .nav-step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .empty-state { font-weight: bold; color: #94a3b8; padding: 20px 0; }
    </style>
</head>
<body>

<div class="header-zone">
    <h1>🎙️ مختبر النطق الصوتي الذكي ✨</h1>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 5px;">اختر الوحدة ونوع الكلمات، ثم استمع وتحدث بثقة</p>
</div>

<!-- أدوات فرز وتقسيم الكلمات -->
<div class="selector-container">
    <select class="styled-select" id="unit-picker" onchange="handleUnitOrCategoryChange()">
        <option value="unit1">الوحدة الأولى - Unit 1 Words</option>
        <option value="unit2">الوحدة الثانية - Unit 2 Words</option>
        <option value="unit3">الوحدة الثالثة - Unit 3 Words</option>
        <option value="unit4">الوحدة الرابعة - Unit 4 Words</option>
        <option value="unit5">الوحدة الخامسة - Unit 5 Words</option>
        <option value="unit6">الوحدة السادسة - Unit 6 Words</option>
    </select>

    <div class="category-tabs">
        <button class="tab-btn active-tab" id="tab-main" onclick="switchCategory('main')">كلمات الوحدة الأساسية</button>
        <button class="tab-btn" id="tab-optional" onclick="switchCategory('optional')">اختياري Option</button>
    </div>
</div>

<!-- صندوق التنويه يظهر فقط عند اختيار "اختياري" -->
<div class="disclaimer-box" id="disclaimer-banner">
    ⚠️ تنويه: هذه الكلمات خارج المنهج لمن لديه الرغبة في زيادة حصيلته اللغوية.
</div>

<!-- كارت عرض الكلمة والتفاعل الصوتي -->
<div class="phonics-card">
    <div id="active-play-content">
        <div style="font-size: 0.9rem; color: #818cf8; font-weight: bold;" id="word-counter">الكلمة 1 من 1</div>
        
        <div class="word-display" id="current-english-word">-</div>
        <div class="word-translation" id="current-arabic-word">-</div>

        <div class="control-btns">
            <button class="action-btn btn-listen" onclick="listenToBritishWord()" title="استمع للكلمة">🔊</button>
            <button class="action-btn btn-record" id="mic-trigger-btn" onclick="startVoiceRecognition()" title="اضغط وتحدث">🎤</button>
        </div>

        <div class="feedback-box" id="feedback-screen">
            <span class="status-idle">اضغط على زر الاستماع أولاً، ثم قلها بنفسك!</span>
        </div>
    </div>
    <div id="empty-content" class="empty-state" style="display: none;">
        لا توجد كلمات مضافة في هذا القسم حالياً.
    </div>
</div>

<div class="nav-navigators">
    <button class="nav-step-btn" id="prev-btn" onclick="moveWord(-1)" disabled>السابق ⬅️</button>
    <button class="nav-step-btn" onclick="window.location.href='dashboard.html'">لوحة التحكم 🏠</button>
    <button class="nav-step-btn" id="next-btn" onclick="moveWord(1)">التالي ➡️</button>
</div>

<script>
    // قاعدة البيانات المنظمة بالوحدات والفئات (أساسي واختياري متوافق مع البيئة المصرية)
    const phonicsDatabase = {
        unit1: {
            main: [
                { en: "Hello", ar: "أهلاً بك" },
                { en: "Goodbye", ar: "مع السلامة" },
                { en: "Book", ar: "كتاب" },
                { en: "Blue", ar: "اللون الأزرق" }
            ],
            optional: [
                { en: "Welcome", ar: "مرحباً بك" },
                { en: "Friend", ar: "صديق" },
                { en: "School", ar: "مدرسة" }
            ]
        },
        unit2: { main: [], optional: [] }, // جاهزة لإضافة كلمات مستقبلاً
        unit3: { main: [], optional: [] },
        unit4: { main: [], optional: [] },
        unit5: {
            main: [
                { en: "Father", ar: "الأب" },
                { en: "Mother", ar: "الأم" },
                { en: "Brother", ar: "الأخ" },
                { en: "Sister", ar: "الأخت" },
                { en: "Tea", ar: "شاي" }
            ],
            optional: [
                { en: "Tree", ar: "شجرة" },
                { en: "Family", ar: "عائلة" },
                { en: "Home", ar: "منزل" }
            ]
        },
        unit6: {
            main: [
                { en: "Drum", ar: "طبلة" },
                { en: "Guitar", ar: "جيتار" },
                { en: "Violin", ar: "كمان" },
                { en: "Piano", ar: "بيانو" },
                { en: "Flute", ar: "ناي" }
            ],
            optional: [
                { en: "Green", ar: "اللون الأخضر" },
                { en: "Music", ar: "موسيقى" }
            ]
        }
    };

    let currentUnit = "unit1";
    let currentCategory = "main";
    let currentIdx = 0;
    let activeWordsList = [];
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-GB'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            document.getElementById('mic-trigger-btn').classList.remove('recording-active');
            
            const studentSpeech = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = activeWordsList[currentIdx].en.toLowerCase().trim();
            const feedbackArea = document.getElementById('feedback-screen');

            if (studentSpeech === targetWord || studentSpeech.includes(targetWord)) {
                feedbackArea.innerHTML = `<span class="status-success">🎉 Excellent! ممتاز</span>`;
                playLocalFeedbackAudio(true);
            } else {
                feedbackArea.innerHTML = `<span class="status-fail">🔄 Try again! حاول مجدداً</span>`;
                playLocalFeedbackAudio(false);
            }
        };

        recognition.onerror = () => {
            document.getElementById('mic-trigger-btn').classList.remove('recording-active');
            document.getElementById('feedback-screen').innerHTML = `<span class="status-fail">❌ لم أسمعك جيداً، حاول مرة أخرى</span>`;
        };

        recognition.onend = () => {
            document.getElementById('mic-trigger-btn').classList.remove('recording-active');
        };
    }

    function listenToBritishWord() {
        if (activeWordsList.length === 0) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const target = activeWordsList[currentIdx].en;
            const utterance = new SpeechSynthesisUtterance(target);
            
            const voices = window.speechSynthesis.getVoices();
            const britishVoice = voices.find(v => v.lang === 'en-GB' || v.lang.includes('GB'));
            
            if (britishVoice) utterance.voice = britishVoice;
            utterance.lang = 'en-GB';
            utterance.rate = 0.85; 
            
            window.speechSynthesis.speak(utterance);
        } else {
            alert("متصفحك لا يدعم النطق الآلي.");
        }
    }

    function startVoiceRecognition() {
        if (activeWordsList.length === 0) return;
        if (!SpeechRecognition) {
            alert("ميزة التعرف على النطق غير مدعومة بالكامل على هذا المتصفح. يرجى استخدام متصفح Chrome.");
            return;
        }
        
        window.speechSynthesis.cancel(); 
        const micBtn = document.getElementById('mic-trigger-btn');
        const feedbackArea = document.getElementById('feedback-screen');
        
        micBtn.classList.add('recording-active');
        feedbackArea.innerHTML = `<span class="status-idle" style="color:#ef4444;">🎤 جاري الاستماع لنطقك... تحدث الآن</span>`;
        
        try {
            recognition.start();
        } catch (e) {
            recognition.stop();
        }
    }

    function switchCategory(category) {
        currentCategory = category;
        document.getElementById('tab-main').classList.toggle('active-tab', category === 'main');
        document.getElementById('tab-optional').classList.toggle('active-tab', category === 'optional');
        
        // إظهار أو إخفاء التنويه بناءً على الفئة المختارة
        document.getElementById('disclaimer-banner').style.display = (category === 'optional') ? 'block' : 'none';
        
        handleUnitOrCategoryChange();
    }

    function handleUnitOrCategoryChange() {
        currentUnit = document.getElementById('unit-picker').value;
        activeWordsList = phonicsDatabase[currentUnit][currentCategory] || [];
        currentIdx = 0;
        renderWord();
    }

    function renderWord() {
        const playContent = document.getElementById('active-play-content');
        const emptyContent = document.getElementById('empty-content');
        
        if (activeWordsList.length === 0) {
            playContent.style.display = 'none';
            emptyContent.style.display = 'block';
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            return;
        }

        playContent.style.display = 'block';
        emptyContent.style.display = 'none';

        const item = activeWordsList[currentIdx];
        document.getElementById('current-english-word').innerText = item.en;
        document.getElementById('current-arabic-word').innerText = `( ${item.ar} )`;
        document.getElementById('word-counter').innerText = `الكلمة ${currentIdx + 1} من ${activeWordsList.length}`;
        
        document.getElementById('feedback-screen').innerHTML = `<span class="status-idle">اضغط على زر الاستماع أولاً، ثم قلها بنفسك!</span>`;
        
        document.getElementById('prev-btn').disabled = (currentIdx === 0);
        document.getElementById('next-btn').disabled = (currentIdx === activeWordsList.length - 1);
    }

    function moveWord(direction) {
        currentIdx += direction;
        renderWord();
    }

    function playLocalFeedbackAudio(isSuccess) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (isSuccess) {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime); 
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.25);
        } else {
            osc.frequency.setValueAtTime(220, ctx.currentTime); 
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    window.onload = handleUnitOrCategoryChange;
</script>
</body>
</html>
